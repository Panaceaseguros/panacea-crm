<title>Panacea CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#F7F5EC; --surface:#FFFFFF; --surface-2:#F0EDE1; --border:#E3DFCF;
    --ink:#152420; --ink-muted:#5D6E67; --ink-faint:#8B978F; --shadow:rgba(15,46,39,.14);
    --teal-900:#0F2E27; --teal-800:#153B32; --teal-700:#1B4A3F; --teal-tint:#E4ECE8;
    --gold:#B9922E; --gold-dark:#8F701E; --gold-light:#E7C765; --gold-tint:#F7EFD9;
    --success:#2E7D5B; --success-tint:#E1F0E8;
    --warning:#C77D22; --warning-tint:#FBEBD6;
    --critical:#B23B3B; --critical-tint:#F8E4E1;
    --info:#3B6FB2; --info-tint:#E4ECF6;
    --radius-lg:22px; --radius-md:14px; --radius-sm:9px;
    --font-display:'Sora',ui-sans-serif,system-ui,sans-serif;
    --font-body:'Karla',ui-sans-serif,system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  svg{width:1em; height:1em; flex:none; vertical-align:-0.125em;}
  body{font-family:var(--font-body); -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; background:var(--teal-900);}
  h1,h2,h3,.disp{font-family:var(--font-display); text-wrap:balance; letter-spacing:-.01em;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:#F7EFD9; color:#0F2E27;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  /* app fills the real viewport — always the brand/light theme, same design
     the approved prototype locked the phone-mock screen to */
  .app-shell{
    position:fixed; inset:0; background:#fff;
    --bg:#F7F5EC; --surface:#FFFFFF; --surface-2:#F0EDE1; --border:#E3DFCF;
    --ink:#152420; --ink-muted:#5D6E67; --ink-faint:#8B978F; --shadow:rgba(15,46,39,.14);
    --teal-tint:#E4ECE8; --gold-tint:#F7EFD9;
    --success-tint:#E1F0E8; --warning-tint:#FBEBD6; --critical-tint:#F8E4E1; --info-tint:#E4ECF6;
    display:flex; flex-direction:column; font-size:15.5px; color:#16231F; overflow:hidden;
  }
  .app-bar{
    background:linear-gradient(155deg, var(--teal-900), var(--teal-800));
    color:#fff; padding:max(20px,env(safe-area-inset-top)) 16px 14px; flex:none; position:relative;
  }
  .app-bar .row1{display:flex; align-items:center; justify-content:space-between; gap:.5rem;}
  .app-bar .who{display:flex; align-items:center; gap:.5rem; min-width:0;}
  .app-bar .glyph{color:var(--gold-light); font-size:1.15rem; flex:none;}
  .app-bar .role-name{font-family:var(--font-display); font-weight:700; font-size:1.02rem;}
  .app-bar .sub{font-size:.72rem; color:#BFD2CB; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-actions{display:flex; gap:.4rem; flex:none;}
  .bell-btn,.logout-btn{position:relative; background:rgba(255,255,255,.12); border:none; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; cursor:pointer;}
  .bell-btn svg,.logout-btn svg{width:16px; height:16px;}
  .bell-dot{position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--gold-light); border:1.5px solid var(--teal-900);}
  .tabs-strip{display:flex; gap:.4rem; margin-top:14px; overflow-x:auto; scrollbar-width:none;}
  .tabs-strip::-webkit-scrollbar{display:none;}
  .tabs-strip button{
    flex:none; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#EAF1EE;
    font-size:.74rem; font-weight:600; padding:.4rem .75rem; border-radius:999px; cursor:pointer;
  }
  .tabs-strip button[aria-selected="true"]{background:var(--gold); border-color:var(--gold); color:#1B1608;}

  .content{flex:1; overflow-y:auto; background:var(--bg); position:relative;}
  .content-pad{padding:16px 16px 34px;}

  .kanban{display:flex; gap:12px; overflow-x:auto; padding:14px 14px 14px; scroll-snap-type:x proximity; height:100%;}
  .kanban::-webkit-scrollbar{height:5px;}
  .column{flex:none; width:270px; scroll-snap-align:start; display:flex; flex-direction:column; max-height:100%;}
  .column-head{display:flex; align-items:center; justify-content:space-between; padding:0 2px 8px;}
  .column-head .name{font-family:var(--font-display); font-weight:700; font-size:.82rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-muted);}
  .column-count{font-family:var(--font-mono); font-size:.72rem; background:var(--surface-2); color:var(--ink-muted); border-radius:999px; padding:.05rem .45rem;}
  .column-body{display:flex; flex-direction:column; gap:9px; overflow-y:auto; padding-bottom:8px; flex:1;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:.75rem .8rem; text-align:left; cursor:pointer; box-shadow:0 1px 2px var(--shadow);
    display:flex; flex-direction:column; gap:.4rem; width:100%;
  }
  .card:hover{border-color:var(--gold);}
  .card .name{font-weight:700; font-size:.9rem; line-height:1.25;}
  .card .meta{color:var(--ink-muted); font-size:.78rem;}
  .card .foot{display:flex; align-items:center; justify-content:space-between; margin-top:.15rem; flex-wrap:wrap; gap:.3rem;}
  .card .money{font-family:var(--font-mono); font-weight:600; font-size:.82rem; color:var(--teal-900);}

  .chip{display:inline-flex; align-items:center; gap:.3rem; font-size:.68rem; font-weight:700; padding:.2rem .5rem; border-radius:999px; white-space:nowrap;}
  .chip svg{width:10px; height:10px;}
  .chip-ok{background:var(--success-tint); color:var(--success);}
  .chip-warn{background:var(--warning-tint); color:var(--warning);}
  .chip-crit{background:var(--critical-tint); color:var(--critical);}
  .chip-info{background:var(--info-tint); color:var(--info);}
  .chip-gold{background:var(--gold-tint); color:var(--gold-dark);}
  .chip-neutral{background:var(--surface-2); color:var(--ink-muted);}

  .empty-col{border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:1rem .7rem; color:var(--ink-faint); font-size:.78rem; text-align:center;}

  .list{display:flex; flex-direction:column; gap:10px;}
  .row-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:.8rem .85rem; cursor:pointer; box-shadow:0 1px 2px var(--shadow);}
  .row-card:hover{border-color:var(--gold);}
  .row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:.5rem;}
  .row-title{font-weight:700; font-size:.9rem;}
  .row-title svg{width:13px; height:13px; margin-right:1px;}
  .row-sub{color:var(--ink-muted); font-size:.78rem; margin-top:2px;}
  .pending-banner{
    display:flex; gap:.5rem; align-items:flex-start; background:var(--critical-tint); color:var(--critical);
    border-radius:var(--radius-sm); padding:.5rem .6rem; font-size:.76rem; margin-top:.5rem; font-weight:600;
  }
  .pending-banner svg{width:14px; height:14px; flex:none; margin-top:1px;}

  .section-label{font-family:var(--font-display); font-weight:700; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); margin:0 0 .6rem;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:1.1rem;}
  .stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:.75rem .8rem;}
  .stat-tile .n{font-family:var(--font-mono); font-weight:600; font-size:1.35rem; color:var(--teal-900);}
  .stat-tile .l{font-size:.72rem; color:var(--ink-muted); margin-top:1px;}
  .bar-row{display:grid; grid-template-columns:84px 1fr auto; align-items:center; gap:.55rem; margin-bottom:.6rem;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-label{font-size:.72rem; color:var(--ink-muted); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{position:relative; height:10px; background:var(--surface-2); border-radius:6px; overflow:hidden;}
  .bar-fill-prev{position:absolute; top:0; left:0; height:100%; background:var(--warning-tint); border-radius:6px;}
  .bar-fill-rec{position:absolute; top:0; left:0; height:100%; background:var(--teal-900); border-radius:6px;}
  .bar-vals{font-size:.68rem; color:var(--ink-muted); white-space:nowrap;}
  .bar-legend{display:flex; gap:.9rem; font-size:.68rem; color:var(--ink-muted); margin-bottom:.7rem;}
  .bar-legend .sw{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:-1px;}
  .recibo-doc{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:.9rem; margin-bottom:1rem;}
  .recibo-doc-head{display:flex; justify-content:space-between; font-weight:700; font-size:.85rem; background:var(--surface-2); padding:.5rem .6rem; border-radius:8px; margin-bottom:.6rem;}
  .recibo-doc-sub{font-size:.8rem; margin-bottom:.7rem;}
  .recibo-semana{margin-bottom:.5rem;}
  .recibo-semana-head{font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-muted); background:var(--surface-2); padding:.35rem .5rem; border-radius:6px 6px 0 0;}
  .recibo-linha{display:flex; justify-content:space-between; align-items:center; gap:.5rem; padding:.35rem .5rem; font-size:.78rem; border-bottom:1px solid var(--border);}
  .recibo-linha span:first-child{flex:1;}
  .recibo-subtotal{background:var(--surface-2); font-weight:700;}
  .recibo-total{background:var(--teal-900); color:#fff; font-weight:700; border-radius:8px; margin-top:.5rem; padding:.6rem .65rem; border-bottom:none;}
  .recibo-linha-del{border:none; background:none; color:var(--critical); font-size:1.05rem; line-height:1; cursor:pointer; padding:0 .2rem; flex:none;}
  .recibo-doc-foot{margin-top:.9rem; padding-top:.7rem; border-top:1px dashed var(--border); font-size:.8rem;}
  .recibo-assinatura{display:flex; align-items:center; gap:.4rem; font-size:.78rem; color:var(--ink-muted); margin-top:.6rem;}
  .recibo-assinatura.ok{color:var(--success);}
  .dept-btn{width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:.8rem .85rem; cursor:pointer; display:flex; align-items:center; gap:.6rem; margin-bottom:9px;}
  .dept-btn:hover{border-color:var(--gold);}
  .dept-btn .ic{width:34px; height:34px; border-radius:10px; background:var(--teal-tint); color:var(--teal-900); display:grid; place-items:center; flex:none;}
  .dept-btn .ic svg{width:16px; height:16px;}
  .dept-btn .tt{font-weight:700; font-size:.86rem;}
  .dept-btn .ss{font-size:.75rem; color:var(--ink-muted);}
  .dept-btn .arrow{margin-left:auto; color:var(--ink-faint); width:14px; height:14px;}
  .dept-btn .arrow svg{width:14px; height:14px;}

  .switcher{padding:12px 14px 2px; display:flex; flex-direction:column; gap:6px;}
  .switch-label{font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);}
  .switch-row{display:flex; flex-wrap:wrap; gap:.35rem;}
  .switch-row button{border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:.72rem; font-weight:700; padding:.32rem .65rem; border-radius:999px; cursor:pointer; white-space:nowrap;}
  .switch-row button[aria-pressed="true"]{background:var(--teal-900); border-color:var(--teal-900); color:#fff;}

  .alert-item{display:flex; gap:.55rem; align-items:flex-start; padding:.65rem 0; border-bottom:1px solid var(--border);}
  .alert-item:last-child{border-bottom:none;}
  .alert-ic{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex:none;}
  .alert-ic svg{width:13px; height:13px;}
  .alert-tx{font-size:.8rem; line-height:1.35;}
  .alert-tx b{font-weight:700;}

  .field{margin-bottom:.85rem; display:flex; flex-direction:column; gap:.3rem;}
  .field label{font-size:.74rem; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em;}
  .field select, .field textarea, .field input{
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:.55rem .65rem; font-family:inherit; font-size:.87rem;
    background:var(--surface); color:var(--ink); resize:vertical;
  }
  .field select:focus, .field textarea:focus, .field input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .attach-mock{display:flex; align-items:center; gap:.5rem; border:1.5px dashed var(--border); border-radius:var(--radius-sm); padding:.55rem .65rem; cursor:pointer; font-size:.82rem; color:var(--ink-muted); background:transparent;}
  .attach-mock:hover{border-color:var(--gold); color:var(--gold-dark);}
  .attach-mock svg{width:15px; height:15px;}
  .attach-chip{display:inline-flex; align-items:center; gap:.35rem; background:var(--gold-tint); color:var(--gold-dark); font-size:.76rem; font-weight:600; padding:.3rem .55rem; border-radius:999px; margin-top:.4rem;}
  .btn{
    font-family:var(--font-display); font-weight:700; font-size:.84rem; border:none; border-radius:999px;
    padding:.65rem 1.1rem; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:.4rem; width:100%;
  }
  .btn svg{width:14px; height:14px;}
  .btn:disabled{opacity:.6; cursor:default;}
  .btn-primary{background:var(--teal-900); color:#fff;}
  .btn-primary:hover{background:var(--teal-800);}
  .btn-gold{background:var(--gold); color:#251D08;}
  .btn-gold:hover{background:var(--gold-dark); color:#fff;}
  .btn-ghost{background:var(--surface-2); color:var(--ink);}
  .btn-danger{background:var(--critical-tint); color:var(--critical);}
  .btn-row{display:flex; flex-direction:column; gap:.55rem; margin-top:1rem;}

  .tabbar{flex:none; display:flex; overflow-x:auto; border-top:1px solid var(--border); background:var(--surface); padding-bottom:env(safe-area-inset-bottom);}
  .tabbar button{flex:1 1 0; background:none; border:none; padding:.55rem .35rem .7rem; display:flex; flex-direction:column; align-items:center; gap:.2rem; cursor:pointer; color:var(--ink-faint); white-space:nowrap;}
  .tabbar button svg{width:19px; height:19px;}
  .tabbar button span{font-size:.62rem; font-weight:700;}
  .tabbar button[aria-selected="true"]{color:var(--teal-900);}
  .tabbar button[aria-selected="true"] svg{color:var(--gold-dark);}

  .sheet-backdrop{position:fixed; inset:0; background:rgba(10,20,17,.42); z-index:20; opacity:0; pointer-events:none; transition:opacity .18s;}
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; max-height:86%; background:var(--surface);
    border-radius:22px 22px 0 0; z-index:21; padding:1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom)); box-shadow:0 -10px 30px var(--shadow);
    transform:translateY(100%); transition:transform .22s ease; display:flex; flex-direction:column;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:99px; margin:0 auto .7rem;}
  .sheet-scroll{overflow-y:auto; flex:1;}
  .sheet h3{margin:0 0 .2rem; font-size:1.02rem;}
  .sheet .close-x{position:absolute; top:.8rem; right:.9rem; background:var(--surface-2); border:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; cursor:pointer; color:var(--ink-muted);}
  .sheet .close-x svg{width:13px; height:13px;}
  .kv{display:flex; justify-content:space-between; gap:1rem; padding:.4rem 0; border-bottom:1px solid var(--border); font-size:.82rem;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--ink-muted);}
  .kv svg{width:12px; height:12px; margin-right:1px;}
  .kv .v{font-weight:600; text-align:right;}
  .timeline{display:flex; flex-direction:column; gap:.6rem; margin-top:.3rem;}
  .tl-item{display:flex; gap:.55rem;}
  .tl-dot{width:7px; height:7px; border-radius:50%; background:var(--gold); margin-top:.4rem; flex:none;}
  .tl-tx{font-size:.8rem;}
  .tl-tx .d{color:var(--ink-faint); font-size:.7rem;}

  .toast{
    position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom)); transform:translate(-50%,10px); background:var(--teal-900); color:#fff;
    padding:.55rem .95rem; border-radius:999px; font-size:.8rem; font-weight:600; box-shadow:0 8px 20px var(--shadow);
    z-index:30; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; display:flex; align-items:center; gap:.4rem; max-width:88vw;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}
  .toast svg{width:14px; height:14px; color:var(--gold-light); flex:none;}

  /* auth screens */
  .auth-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1.3rem; background:linear-gradient(155deg, var(--teal-900), var(--teal-800)); min-height:100%; overflow-y:auto;}
  .auth-card{width:100%; max-width:360px; background:var(--surface); border-radius:var(--radius-lg); padding:1.8rem 1.6rem; box-shadow:0 20px 50px rgba(0,0,0,.28);}
  .auth-brand{display:flex; flex-direction:column; align-items:center; gap:.3rem; margin-bottom:1.3rem; text-align:center;}
  .auth-brand .glyph{font-size:1.7rem; color:var(--gold);}
  .auth-brand .word{font-family:var(--font-display); font-weight:800; font-size:1.1rem; letter-spacing:.04em; text-transform:uppercase; color:var(--teal-900);}
  .auth-brand .word small{display:block; font-family:'Karla'; font-weight:400; font-style:italic; text-transform:none; letter-spacing:0; font-size:.74rem; color:var(--ink-muted); margin-top:-2px;}
  .auth-title{font-family:var(--font-display); font-weight:700; font-size:1.04rem; text-align:center; margin-bottom:.2rem;}
  .auth-sub{color:var(--ink-muted); font-size:.83rem; text-align:center; margin-bottom:1.2rem;}
  .auth-error{background:var(--critical-tint); color:var(--critical); font-size:.82rem; font-weight:600; padding:.6rem .7rem; border-radius:var(--radius-sm); margin-bottom:.9rem; display:flex; gap:.4rem; align-items:flex-start;}
  .auth-error svg{width:14px;height:14px;flex:none;margin-top:1px;}
  .auth-note{background:var(--success-tint); color:var(--success); font-size:.82rem; font-weight:600; padding:.6rem .7rem; border-radius:var(--radius-sm); margin-bottom:.9rem;}
  .auth-switch{text-align:center; font-size:.82rem; color:var(--ink-muted); margin-top:1.1rem;}
  .auth-switch button{background:none;border:none;color:var(--gold-dark);font-weight:700;cursor:pointer;padding:0;font-size:inherit;}
  .pending-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1.4rem; text-align:center; gap:.8rem; background:var(--bg);}
  .pending-wrap .ic-big{width:52px;height:52px;border-radius:50%;background:var(--gold-tint);color:var(--gold-dark);display:grid;place-items:center;}
  .pending-wrap .ic-big svg{width:24px;height:24px;}
  .pending-wrap h2{font-size:1.1rem;margin:0;}
  .pending-wrap p{color:var(--ink-muted);font-size:.88rem;max-width:32ch;margin:0;}
  .loading-wrap{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:.86rem;background:var(--bg);}

  /* Coach de IA comercial — mascote + balão + conversa em chat */
  .coach-wrap{display:flex; flex-direction:column; gap:.7rem;}
  .coach-header{display:flex; align-items:flex-start; gap:.6rem;}
  .coach-avatar{width:56px; height:72px; flex:none; animation:coachBob 3.4s ease-in-out infinite;}
  .coach-avatar svg{width:100%; height:100%;}
  .coach-avatar .blink{animation:coachBlink 4.6s ease-in-out infinite;}
  @keyframes coachBob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);}}
  @keyframes coachBlink{0%,92%,100%{transform:scaleY(1);} 95%{transform:scaleY(.12);}}
  .coach-bubble{position:relative; background:var(--info-tint); color:var(--teal-900); border-radius:14px; padding:.65rem .8rem; font-size:.83rem; line-height:1.4; flex:1; font-weight:600;}
  .coach-bubble::before{content:''; position:absolute; left:-6px; top:14px; width:12px; height:12px; background:var(--info-tint); transform:rotate(45deg); border-radius:2px;}
  .coach-bubble.thinking{display:flex; align-items:center; gap:.3rem; font-weight:400; color:var(--ink-muted);}
  .coach-dot{width:5px; height:5px; border-radius:50%; background:var(--ink-faint); animation:coachDot 1.2s ease-in-out infinite;}

  // Próxima data de aniversário de um contrato (dia/mês), projetando pro
  // próximo ano se a data deste ano já passou.
  function proximoAniversario(dia, mes){
    var hoje = new Date(); hoje.setHours(0,0,0,0);
    var ano = hoje.getFullYear();
    var cand = new Date(ano, mes-1, Math.min(dia, 28));
    // ajuste pra meses com menos dias (evita "rolar" pro mês seguinte)
    var ultimoDiaMes = new Date(ano, mes, 0).getDate();
    cand = new Date(ano, mes-1, Math.min(dia, ultimoDiaMes));
    if(cand < hoje){
      ultimoDiaMes = new Date(ano+1, mes, 0).getDate();
      cand = new Date(ano+1, mes-1, Math.min(dia, ultimoDiaMes));
    }
    return cand;
  }

  /* ============== CONCILIAÇÃO DE COMISSÕES — leitura dos relatórios ==============
     Cada operadora manda o extrato de comissão num formato diferente. Os

  var COMISSAO_OPERADORAS = [

  function parseNumBR(s){
    if(s==null) return null;
    s = String(s).trim().replace(/^R\$\s*/, '');
    if(s==='' || s==='-') return null;
    s = s.replace(/\./g, '').replace(',', '.');

  function parseDateBRComissao(s){
    if(!s) return null;
    var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s).trim());

  function competenciaFromDateBR(s){

  function competenciaFromMesAno(s){
    if(!s) return null;
    s = String(s).trim().toLowerCase();
    var m1 = /^([a-zç]{3})\/(\d{2,4})$/.exec(s);
    if(m1 && MES_ABREV_PT[m1[1]]){ var ano = m1[2].length===2 ? '20'+m1[2] : m1[2]; return ano+'-'+MES_ABREV_PT[m1[1]]; }
    var m2 = /^(\d{2})\/(\d{4})$/.exec(s);

    if(/^\d{4}-\d{2}$/.test(s)) return s;

  function modaCompetencia(linhas){
    var counts = {}, best = null, bestN = 0;
    linhas.forEach(function(l){ if(l.competencia) counts[l.competencia] = (counts[l.competencia]||0)+1; });
    Object.keys(counts).forEach(function(k){ if(counts[k]>bestN){ best=k; bestN=counts[k]; } });

  }

  // Porto Seguro — CSV ';' com cabeçalho fixo de 8 linhas.
  function parsePorto(text){
    var linhas = text.split(/\r?\n/), out = [];
    for(var i=0;i<linhas.length;i++){
      var cols = linhas[i].split(';');
      if(cols.length<12) continue;
      var nome = (cols[0]||'').trim();
      if(!nome || /^total/i.test(nome)) continue;
      var apl = (cols[3]||'').trim();
      if(!/^\d+$/.test(apl)) continue;
      var data = (cols[7]||'').trim();
      if(!/^\d{2}\/\d{2}\/\d{4}$/.test(data)) continue; // descarta a linha de totais do rodapé
      out.push({
        identificador: apl, nomeCliente: nome, parcelaNumero: parseInt(cols[5],10)||null,
        competencia: competenciaFromDateBR(data), valorBase: parseNumBR(cols[8]), percentual: parseNumBR(cols[9]),
        valorComissao: parseNumBR(cols[10])||0, dataPagamento: parseDateBRComissao(data)

    return out;
  }

  // SulAmérica — largura fixa, sem delimitador; um "bloco de empresa" por
  // linha, identificado por regex ancorada no dígito do item + nome maiúsculo.
  function parseSulamerica(text){
    var pat = new RegExp(
      '\\s(\\d)([A-ZÀ-Ü][A-ZÀ-Ü0-9ÇÃÕÁÉÍÓÚÂÊÔ\\.\\-&\'" ]*?)\\s{2,}'+
      '(\\d{4,6})\\s+'+
      '(\\d{3}\\w{2,4})\\s+'+
      '(\\d{6,10})\\s+'+
      '(\\S{1,10})\\s+'+
      '(\\S{5,10})\\s+'+
      '\\d+\\s+'+
      '(\\d{2,6})(\\d{2}/\\d{2}/\\d{4})\\s+'+
      '\\d\\s+\\d\\s+\\d\\s+\\d\\s+'+
      '([\\d\\.]+,\\d{2})\\s+'+
      '(\\d+)\\s+\\d+\\s+'+
      '([\\d\\.]+,\\d{2})'
    );
    var linhas = text.split(/\r?\n/), out = [];
    linhas.forEach(function(linhaRaw){
      var linha = linhaRaw.replace(/^﻿/, '');
      if(!linha.trim()) return;
      var m = pat.exec(linha);
      if(!m) return;
      var data = m[9];
      out.push({
        identificador: m[5], nomeCliente: m[2].trim(), parcelaNumero: null,
        competencia: competenciaFromDateBR(data), valorBase: parseNumBR(m[10]), percentual: parseNumBR(m[11]),
        valorComissao: parseNumBR(m[12])||0, dataPagamento: parseDateBRComissao(data)
      });
    });
    return out;
  }

  // Bradesco Saúde — CSV ';' com 2 linhas de cabeçalho, dados a partir da 3ª.
  function parseBradesco(text){
    var linhas = text.split(/\r?\n/).filter(function(l){return l.trim();});
    var out = [];
    for(var i=2;i<linhas.length;i++){
      var cols = linhas[i].split(';');
      if(cols.length<50) continue;
      var seq = (cols[0]||'').trim();
      if(!/^\d+$/.test(seq)) continue;
      var nome = (cols[45]||'').trim();
      if(!nome) continue;
      var apolice = (cols[42]||'').trim();
      var dataFatura = (cols[2]||'').trim();
      out.push({
        identificador: apolice ? (apolice+'|'+nome) : nome, nomeCliente: nome,
        parcelaNumero: parseInt(cols[46],10)||null, competencia: competenciaFromDateBR(dataFatura),
        valorBase: parseNumBR(cols[47]), percentual: parseNumBR(cols[48]), valorComissao: parseNumBR(cols[49])||0,
        dataPagamento: parseDateBRComissao(dataFatura)
      });

    return out;
  }

  // Alice — CSV ';' com um resumo no topo; a tabela de membros começa na

  function parseAlice(text){
    var linhas = text.split(/\r?\n/);
    var headerIdx = -1;
    for(var i=0;i<linhas.length;i++){ if(linhas[i].indexOf('CPF Membro')!==-1){ headerIdx=i; break; } }
    if(headerIdx===-1) return [];
    var out = [];
    for(var j=headerIdx+1;j<linhas.length;j++){
      var cols = linhas[j].split(';');
      if(cols.length<12) continue;
      var cpf = (cols[0]||'').trim();
      if(!/^\d+$/.test(cpf)) continue;
      var nome = (cols[1]||'').trim();
      var razao = (cols[5]||'').trim();
      var contrato = (cols[3]||'').trim();
      out.push({
        identificador: contrato || (cpf+'|'+nome),
        nomeCliente: (razao && razao!==nome) ? (nome+' ('+razao+')') : nome,
        parcelaNumero: parseInt(cols[6],10)||null, competencia: competenciaFromMesAno(cols[7]),
        valorBase: parseNumBR(cols[9]), percentual: parseNumBR(cols[10]), valorComissao: parseNumBR(cols[11])||0,
        dataPagamento: /^\d{4}-\d{2}-\d{2}$/.test((cols[8]||'').trim()) ? cols[8].trim() : null
      });
    }
    return out;
  }

  // Hapvida — CSV ';' com um único cabeçalho. Cada beneficiário pode
  // aparecer 2x (saúde/odonto) com código de usuário diferente — cada linha
  // vira uma parcela própria.
  function parseHapvida(text){
    var linhas = text.split(/\r?\n/).filter(function(l){return l.trim();});
    var out = [];
    for(var i=1;i<linhas.length;i++){
      var cols = linhas[i].split(';');
      if(cols.length<27) continue;
      var cdUsuario = (cols[12]||'').trim();
      if(!cdUsuario) continue;
      var valorBaseSaude = parseNumBR(cols[17]);
      var valorBaseOdonto = parseNumBR(cols[19]);
      var dtPagamento = (cols[6]||'').trim();
      out.push({
        identificador: cdUsuario, nomeCliente: (cols[13]||'').trim(),
        parcelaNumero: parseInt(cols[16],10)||null,
        competencia: competenciaFromDateBR(dtPagamento) || competenciaFromDateBR((cols[5]||'').trim()),
        valorBase: (valorBaseSaude && valorBaseSaude>0) ? valorBaseSaude : valorBaseOdonto,
        percentual: parseNumBR(cols[21]), valorComissao: parseNumBR(cols[22])||0,
        dataPagamento: parseDateBRComissao(dtPagamento)
      });
    }
    return out;
  }

  // Amil — texto delimitado por '#'; acha a tabela pelo cabeçalho que começa
  // com "Porte Contrato#Contrato".
  function parseAmil(text){
    var linhas = text.split(/\r?\n/);
    var headerIdx = -1;
    for(var i=0;i<linhas.length;i++){ if(linhas[i].indexOf('Porte Contrato#Contrato')===0){ headerIdx=i; break; } }
    if(headerIdx===-1) return [];
    var out = [];
    for(var j=headerIdx+1;j<linhas.length;j++){
      var linha = linhas[j];
      if(!linha.trim()) break; // fim da tabela de itens (o resumo vem depois)
      var cols = linha.split('#');
      if(cols.length<17) continue;
      var contrato = (cols[1]||'').trim();
      if(!contrato) continue;
      out.push({
        identificador: contrato, nomeCliente: (cols[17]||'').trim() || contrato,
        parcelaNumero: parseInt(cols[5],10)||null, competencia: competenciaFromMesAno(cols[7]),
        valorBase: parseNumBR(cols[15]), percentual: parseNumBR(cols[6]), valorComissao: parseNumBR(cols[16])||0,
        dataPagamento: null
      });
    }
    return out;
  }

  // CNU — CSV ';' com um único cabeçalho.
  function parseCnu(text){
    var linhas = text.split(/\r?\n/).filter(function(l){return l.trim();});
    var out = [];
    for(var i=1;i<linhas.length;i++){
      var cols = linhas[i].split(';');
      if(cols.length<18) continue;
      var contrato = (cols[2]||'').trim();
      if(!contrato) continue;
      var nome = (cols[8]||'').trim() || (cols[3]||'').trim();
      var venc = (cols[9]||'').trim();
      out.push({
        identificador: contrato, nomeCliente: nome,
        parcelaNumero: parseInt(cols[14],10)||null, competencia: competenciaFromMesAno(cols[10]),
        valorBase: parseNumBR(cols[15]), percentual: parseNumBR(cols[16]), valorComissao: parseNumBR(cols[17])||0,
        dataPagamento: parseDateBRComissao(venc)
      });
    }
    return out;
  }

  function parseRelatorioComissao(operadora, text){
    switch(operadora){
      case 'porto': return parsePorto(text);
      case 'sulamerica': return parseSulamerica(text);
      case 'bradesco': return parseBradesco(text);
      case 'alice': return parseAlice(text);
      case 'hapvida': return parseHapvida(text);
      case 'amil': return parseAmil(text);
      case 'cnu': return parseCnu(text);
      default: return [];
    }
  }
  function readFileAsText(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(reader.error); };
      reader.readAsText(file, 'UTF-8');
    });
  }

  function traduzErroAuth(error){
    var m = (error && error.message) || '';
    if(/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
    if(/already registered|already exists|User already registered/i.test(m)) return 'Já existe uma conta com esse e-mail — tente entrar.';
    if(/password should be|at least 6/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
    if(/rate limit/i.test(m)) return 'Muitas tentativas — espere um instante e tente de novo.';
    if(/email/i.test(m) && /invalid/i.test(m)) return 'Esse e-mail não parece válido.';
    return 'Não deu certo agora — confira os dados e tente novamente.';
  }

  function handleLogin(e){
    e.preventDefault();
    authMsg();
    var form = e.target;
    var email = form.email.value.trim();
    var password = form.password.value;
    var btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    sb.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      btn.disabled = false;
      if(res.error){ authMsg('error', traduzErroAuth(res.error)); return; }
      session = res.data.session;
      loadPerfilAndStart();
    });
  }

  function handleSignup(e){
    e.preventDefault();
    authMsg();
    var form = e.target;
    var email = form.email.value.trim();
    var password = form.password.value;
    var btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    sb.auth.signUp({ email: email, password: password }).then(function(res){
      btn.disabled = false;
      if(res.error){ authMsg('error', traduzErroAuth(res.error)); return; }
      if(res.data.session){ session = res.data.session; loadPerfilAndStart(); }
      else { authMsg('ok', 'Conta criada! Se pedirmos confirmação por e-mail, confirme e depois volte aqui pra entrar.'); }
    });
  }

  function loadPerfilAndStart(){
    document.getElementById('appShell').innerHTML = loadingHtml('Carregando sua conta...');
    sb.auth.getUser().then(function(res){
      var user = res.data && res.data.user;
      if(!user){ renderLogin(); return; }
      sb.from('perfis').select('*, empresas(nome)').eq('id', user.id).maybeSingle().then(function(pres){
        if(pres.error || !pres.data){ renderPending(user.email); return; }
        var row = pres.data;
        perfil = { id:row.id, papel:row.papel, nome:row.nome, email:user.email, empresaId:row.empresa_id, empresaNome: row.empresas ? row.empresas.nome : null };
        if(!lastTabByRole[perfil.papel]) lastTabByRole[perfil.papel] = ROLES_META[perfil.papel].tabs[0].key;
        document.getElementById('appShell').innerHTML = appFrameHtml();
        bindShellHandlers();
        renderAppBar(); renderBottomTabbar();
        document.getElementById('contentArea').innerHTML = loadingHtml('Carregando dados...');
        refreshData().then(renderContent);

    });
  }

  function computeAlerts(){
    var out = [];
    STATE.leads.forEach(function(l){
      if(['fechado','perdido'].indexOf(l.etapa)===-1 && l.dias>=5){
        out.push({icon:'clock', tone:'warn', text:'Lead <b>'+l.nome+'</b> parado há '+l.dias+' dias em "'+LEAD_STAGES.find(function(s){return s.key===l.etapa;}).label+'".'});
      }
      if(l.followupAtrasado){
        out.push({icon:'alert', tone:'crit', text:'Follow-up de <b>'+l.nome+'</b> estava marcado para '+l.followup+' e ainda não foi feito.'});
      }
    });
    STATE.tasks.forEach(function(t){
      if(t.atrasada) out.push({icon:'alert', tone:'crit', text:'Tarefa <b>'+t.titulo+'</b> está atrasada (prazo '+t.prazo+').'});
    });
    STATE.inclusaoPropostas.forEach(function(t){
      if(t.atrasada) out.push({icon:'alert', tone:'crit', text:'Implantação de <b>'+t.empresa+'</b> atrasada (prazo '+t.prazo+').'});
    });
    STATE.financeiro.forEach(function(t){
      if(t.etapa==='inadimplente') out.push({icon:'alert', tone:'crit', text:'<b>'+t.empresa+'</b> está inadimplente — venceu em '+t.vencimento+'.'});
    });
    STATE.posvendas.forEach(function(p){
      (p.anexos||[]).forEach(function(a){
        if(a.expira<=3) out.push({icon:'doc', tone:'warn', text:'Anexo <b>'+a.nome+'</b> ('+p.empresaOuCliente+') expira em '+a.expira+' dia(s).'});
      });
      if(p.pendenciaDoc) out.push({icon:'alert', tone:'crit', text:'Pendência aberta com <b>'+p.empresaOuCliente+'</b>: '+p.pendenciaDescricao});
      if(p.atrasada) out.push({icon:'alert', tone:'crit', text:'Solicitação de <b>'+p.empresaOuCliente+'</b> ('+p.tipo+') está atrasada (prazo '+p.prazo+').'});
    });
    STATE.contratos.forEach(function(c){
      var dias = diasAteAniversario(c.diaAniversario, c.mesAniversario);
      if(dias<=30) out.push({icon:'clock', tone:(dias<=7?'crit':'warn'), text:'Reajuste de <b>'+c.empresaNome+'</b> ('+c.operadora+') em '+dias+' dia(s) — aniversário do contrato.'});
    });
    STATE.segurados.forEach(function(s){
      if(s.situacao==='inadimplente') out.push({icon:'alert', tone:'crit', text:'<b>'+s.nome+'</b> ('+s.empresaNome+') está inadimplente.'});
    });
    STATE.comissoes.forEach(function(c){
      if(c.status==='atrasado') out.push({icon:'alert', tone:'crit', text:'Comissão de <b>'+c.operadora+'</b> ('+c.empresaNome+', '+c.referenciaLabel+') está atrasada.'});
    });
    STATE.comissaoAcompanhamentos.forEach(function(a){
      if(a.status==='pendente_baseline') out.push({icon:'alert', tone:'warn', text:'Falta cadastrar o valor base de <b>'+a.nomeCliente+'</b> ('+operadoraLabel(a.operadora)+') pra começar a conferência de comissão.'});
      else if(a.status==='valor_divergente') out.push({icon:'alert', tone:'crit', text:'Comissão de <b>'+a.nomeCliente+'</b> ('+operadoraLabel(a.operadora)+') veio com valor diferente do esperado.'});
      else if(a.status==='parcela_faltante') out.push({icon:'alert', tone:'crit', text:'<b>'+a.nomeCliente+'</b> ('+operadoraLabel(a.operadora)+') sumiu do último relatório — possível cancelamento.'});
    });
    return out;
  }

  function renderAppBar(){
    var meta = ROLES_META[perfil.papel];
    document.getElementById('appBarRole').textContent = meta.label;
    document.getElementById('appBarSub').textContent = dynamicSub();
    document.getElementById('bellIcon').innerHTML = ic('bell');
    var alerts = computeAlerts();
    document.getElementById('bellDot').style.display = alerts.length ? 'block' : 'none';
    var strip = document.getElementById('tabsStrip');
    strip.innerHTML = meta.tabs.map(function(t){
      return '<button data-tab="'+t.key+'" aria-selected="'+(t.key===lastTabByRole[perfil.papel])+'">'+t.label+'</button>';
    }).join('');
    strip.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){ lastTabByRole[perfil.papel]=b.dataset.tab; closeSheet(); renderBottomTabbar(); renderContent(); });
    });
  }

  function renderBottomTabbar(){
    var meta = ROLES_META[perfil.papel];
    var active = lastTabByRole[perfil.papel];
    var bar = document.getElementById('bottomTabbar');
    bar.innerHTML = meta.tabs.map(function(t){
      return '<button data-tab="'+t.key+'" aria-selected="'+(t.key===active)+'">'+ic(t.icon)+'<span>'+t.label+'</span></button>';
    }).join('');
    bar.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){ lastTabByRole[perfil.papel]=b.dataset.tab; closeSheet(); renderAppBar(); renderContent(); });
    });
  }

  function filterSwitcherHtml(){
    if(perfil.papel!=='posvendas') return '';
    return '<div class="switcher">'+
      '<div class="switch-label">Mostrar</div>'+
      '<div class="switch-row">'+
        '<button data-switch="posvendas-filtro" data-value="meus" aria-pressed="'+(posvendasFiltro==='meus')+'">Meus atendimentos</button>'+
        '<button data-switch="posvendas-filtro" data-value="todos" aria-pressed="'+(posvendasFiltro==='todos')+'">Toda a equipe</button>'+
      '</div></div>';
  }

  function posvendasVisible(){
    if(perfil.papel!=='posvendas') return STATE.posvendas;
    return STATE.posvendas.filter(function(p){ return posvendasFiltro==='todos' || p.responsavel===perfil.nome; });

  function renderContent(){
    var tab = lastTabByRole[perfil.papel];
    var area = document.getElementById('contentArea');
    var html = '';
    switch(tab){
      case 'leads': html = viewKanbanLeads(); break;
      case 'nova-lead': html = viewNovaLead(); break;
      case 'clientes': html = viewClientesFechados(); break;
      case 'perfil': html = viewPerfilVendedor(); break;
      case 'ranking-vendas': html = viewRankingVendedores(); break;
      case 'inclusao': html = viewKanbanInclusao(); break;
      case 'financeiro': html = viewKanbanFinanceiro(); break;
      case 'tarefas': html = viewKanbanTarefas(); break;
      case 'conciliacao': html = viewConciliacao(); break;
      case 'coaching-ia': html = viewCoachingIa(); break;
      case 'visao-adm': html = viewVisaoAdm(); break;
      case 'solicitacoes': html = viewKanbanPosvendas(); break;
      case 'documentos': html = viewDocumentos(); break;
      case 'empresas': html = viewEmpresas(); break;
      case 'minhas-rh': case 'minhas-cli': html = viewMinhasSolic(); break;
      case 'nova-rh': html = viewNovaSolic('rh'); break;
      case 'nova-cli': html = viewNovaSolic('cliente'); break;
      case 'desempenho-rh': html = viewDesempenhoRH(); break;
      case 'pendencias-rh': case 'pendencias-cli': html = viewPendencias(); break;
      case 'visao-geral': html = viewVisaoGeralGestao(); break;
      case 'departamentos': html = viewDepartamentosGestao(); break;
      case 'alertas': html = viewAlertasGestao(); break;
      case 'recibos': html = viewRecibos(); break;
      case 'boletos': html = viewBoletos(); break;
      case 'paineis': html = viewPaineisFinanceiro(); break;
      case 'desempenho-pv': html = viewDesempenhoPosvendas(); break;
      default: html = '<div class="content-pad">Em construção.</div>';
    }
    area.innerHTML = filterSwitcherHtml() + html;

  /* ============== DADOS REAIS (Supabase) ============== */
  function fetchHistoricoFor(tipo, ids){
    if(!ids.length) return Promise.resolve({});
    return sb.from('historico').select('*').eq('entidade_tipo', tipo).in('entidade_id', ids).order('created_at', {ascending:true}).then(function(res){
      var out = {};
      if(res.error) return out;
      (res.data||[]).forEach(function(h){
        if(!out[h.entidade_id]) out[h.entidade_id] = [];
        out[h.entidade_id].push({ d: fmtDateBR(h.created_at), t: h.texto, interno: h.visivel_externo===false });
      });
      return out;
    });
  }

  function fetchAnexosFor(solicitacaoIds){
    if(!solicitacaoIds.length) return Promise.resolve({});
    return sb.from('anexos').select('*').in('solicitacao_id', solicitacaoIds).order('expira_em', {ascending:true}).then(function(res){
      var out = {};
      if(res.error) return out;
      (res.data||[]).forEach(function(a){
        if(!out[a.solicitacao_id]) out[a.solicitacao_id] = [];
        out[a.solicitacao_id].push({ nome:a.nome_arquivo, expira: daysUntil(a.expira_em), path:a.storage_path });
      });
      return out;
    });
  }

  function fetchLeads(){
    return sb.from('leads').select('*, perfis(nome)').order('created_at', {ascending:false}).then(function(res){
      if(res.error){ showToast('Erro ao carregar leads'); STATE.leads=[]; return; }
      var rows = res.data||[];
      return fetchHistoricoFor('lead', rows.map(function(r){return r.id;})).then(function(hist){
        STATE.leads = rows.map(function(r){
          return {
            id:r.id, nome:r.nome_contato, empresa:r.empresa_prospect||'—', tipo:r.tipo_negocio||'—',
            valor:Number(r.valor_estimado)||0, etapa:r.etapa, dias: daysSince(r.updated_at||r.created_at),
            vendedor: (r.perfis && r.perfis.nome) || '—', vendedorId: r.vendedor_id, historico: hist[r.id]||[],
            motivoPerda: r.motivo_perda||'',
            followupISO: r.proximo_followup||null, followup: r.proximo_followup ? fmtDateBR(r.proximo_followup) : null,
            followupAtrasado: computeAtrasada(r.proximo_followup, r.etapa, ['fechado','perdido'])
          };
        });
      });
    });

  function fetchPosvendas(internal){
    var query = internal
      ? sb.from('solicitacoes').select('*, empresas(nome), solicitante:perfis!solicitacoes_solicitante_id_fkey(nome), responsavel:perfis!solicitacoes_responsavel_id_fkey(nome)').order('data_abertura', {ascending:false})
      : sb.from('solicitacoes_status_simplificado').select('*').order('data_abertura', {ascending:false});
    return query.then(function(res){
      if(res.error){ showToast('Erro ao carregar solicitações'); STATE.posvendas=[]; return; }
      var rows;
      if(internal){
        rows = (res.data||[]).map(function(r){
          return {
            id:r.id, tipo:r.tipo, origemTipo:r.origem_tipo,
            empresaOuCliente: (r.empresas && r.empresas.nome) || (r.solicitante && r.solicitante.nome) || '—',
            solicitante: (r.solicitante && r.solicitante.nome) || '—',
            responsavel: (r.responsavel && r.responsavel.nome) || '',
            etapaInterna: r.etapa_interna, dataAbertura: fmtDateBR(r.data_abertura),
            pendenciaDoc: r.pendencia_doc, pendenciaDescricao: r.pendencia_descricao||'',
            prazo: r.prazo ? fmtDateBR(r.prazo) : '', prazoISO: r.prazo || '',
            atrasada: computeAtrasada(r.prazo, r.etapa_interna, 'concluido'),
            dataAberturaISO: r.data_abertura, updatedAtISO: r.updated_at,
            anexos: [], historico: [], _responsavelId: r.responsavel_id
          };
        });
      } else {
        rows = (res.data||[]).map(function(r){
          return {
            id:r.id, tipo:r.tipo, origemTipo:r.origem_tipo,
            empresaOuCliente: r.empresa_nome || perfil.nome,
            solicitante: r.solicitante_nome || perfil.nome,
            responsavel:'', etapaInterna: r.status, dataAbertura: fmtDateBR(r.data_abertura),
            pendenciaDoc: r.pendencia_doc, pendenciaDescricao: r.pendencia_descricao||'',
            anexos: [], historico: []
          };
        });
      }
      var ids = rows.map(function(r){return r.id;});
      return Promise.all([ fetchHistoricoFor('solicitacao', ids), fetchAnexosFor(ids) ]).then(function(both){
        var hist = both[0], anx = both[1];
        rows.forEach(function(r){ r.historico = hist[r.id]||[]; r.anexos = anx[r.id]||[]; });
        STATE.posvendas = rows;
      });
    });
  }

  function refreshData(){
    var p = perfil.papel;
    if(p==='vendedor') return Promise.all([fetchLeads(), fetchRecibosMensais(), fetchRecibosLancamentos(), fetchComissoes(), fetchLeadAtendimentos()]);
    if(p==='administrativo') return Promise.all([fetchTasks(), fetchInclusao(), fetchFinanceiro(), fetchRecibosMensais(), fetchRecibosLancamentos(), fetchContratos(), fetchSegurados(), fetchComissoes(), fetchComissaoAcompanhamentos(), fetchLeadAtendimentos(), fetchBoletosPainel(), fetchBoletosInbox(), fetchEmpresasAll()]);
    if(p==='posvendas') return Promise.all([fetchPosvendas(true), fetchRecibosMensais(), fetchRecibosLancamentos(), fetchEquipeInterna(), fetchBoletosPainel(), fetchBoletosInbox(), fetchEmpresasAll()]);
    if(p==='rh' || p==='cliente') return fetchPosvendas(false);
    if(p==='gestao') return Promise.all([fetchLeads(), fetchTasks(), fetchInclusao(), fetchFinanceiro(), fetchPosvendas(true), fetchRecibosMensais(), fetchRecibosLancamentos(), fetchContratos(), fetchSegurados(), fetchComissoes(), fetchEquipeInterna(), fetchComissaoAcompanhamentos(), fetchLeadAtendimentos(), fetchBoletosPainel(), fetchBoletosInbox(), fetchEmpresasAll()]);
    if(p==='implantacao') return Promise.all([fetchLeads(), fetchTasks(), fetchInclusao(), fetchPosvendas(true), fetchRecibosMensais(), fetchRecibosLancamentos(), fetchEquipeInterna()]);
    return Promise.resolve();
  }

  function handleNovoLeadSubmit(e){
    e.preventDefault();
    var form = e.target;
    var nome = form.nome.value.trim();
    var empresa = form.empresa.value.trim();
    var tipo = form.tipo.value.trim();
    var valor = parseFloat(form.valor.value) || 0;
    var followup = form.followup.value || null;
    if(!nome || !tipo) return;
    var btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    var payload = {
      nome_contato: nome, empresa_prospect: empresa || null, tipo_negocio: tipo,
      valor_estimado: valor, etapa: 'novo', vendedor_id: perfil.id, proximo_followup: followup
    };
    sb.from('leads').insert(payload).select().single().then(function(res){
      if(res.error){ btn.disabled=false; showToast('Não deu pra cadastrar — tente de novo'); return; }
      var row = res.data;
      sb.from('historico').insert({ entidade_tipo:'lead', entidade_id: row.id, texto:'Lead cadastrado pelo app.', created_by: perfil.id }).then(function(){
        showToast('Lead cadastrado');
        lastTabByRole[perfil.papel] = 'leads';
        refreshData().then(function(){ renderAppBar(); renderBottomTabbar(); renderContent(); btn.disabled=false; });
      });
    });
  }

  function viewRankingVendedores(){
    var vendedores = STATE.equipeInterna.filter(function(m){ return m.papel==='vendedor'; });
    var porPessoa = {};
    vendedores.forEach(function(v){ porPessoa[v.id] = { nome:v.nome, total:0, fechados:0, perdidos:0, pipeline:0, somaFechados:0 }; });
    STATE.leads.forEach(function(l){
      var b = porPessoa[l.vendedorId];
      if(!b) return; // vendedor não está mais na equipe ativa
      b.total++;
      if(l.etapa==='fechado'){ b.fechados++; b.somaFechados += l.valor; }
      else if(l.etapa==='perdido'){ b.perdidos++; }
      else { b.pipeline += l.valor; }
    });
    var linhas = vendedores.map(function(v){ return porPessoa[v.id]; }).sort(function(a,b){ return b.fechados - a.fechados; });
    var cards = linhas.map(function(b){
      var ticketMedio = b.fechados ? b.somaFechados / b.fechados : 0;
      var decididos = b.fechados + b.perdidos;
      var conversao = decididos ? Math.round((b.fechados/decididos)*100) : null;
      return '<div class="row-card" style="cursor:default; margin-bottom:.6rem">'+
        '<div class="row-top"><div class="row-title">'+ic('user')+' '+b.nome+'</div>'+
        '<span class="chip '+(conversao==null?'chip-neutral':(conversao>=50?'chip-ok':'chip-warn'))+'">'+(conversao==null?'Sem fechamentos ainda':'Conversão '+conversao+'%')+'</span>'+
        '</div>'+

  /* ============== CENTRAL DE BOLETOS: leitura de PDF + casamento automático ============== */
  // Em vez de um robô entrar sozinho nos portais das operadoras (abandonado
  // — proteções anti-robô reais demais pra contornar com segurança, ver
  // boleto-robo/README.md), o pós-vendas continua baixando o PDF na mão,
  // mas pode jogar vários de uma vez aqui. O app lê cada PDF (CNPJ,
  // operadora, vencimento, linha digitável) e decide sozinho de qual
  // cliente é — só cai pra revisão manual quando não tem certeza.

  var PDFJS_WORKER_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var _pdfWorkerConfigurado = false;
  function garantirPdfWorker(){
    if(_pdfWorkerConfigurado || typeof pdfjsLib==='undefined') return;
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_SRC;
    _pdfWorkerConfigurado = true;
  }

  function extrairTextoPdf(file){
    garantirPdfWorker();
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({ data: buf }).promise;
    }).then(function(pdf){
      var paginas = [];
      for(var i=1;i<=pdf.numPages;i++) paginas.push(i);
      return paginas.reduce(function(prom, num){
        return prom.then(function(acc){
          return pdf.getPage(num).then(function(pagina){ return pagina.getTextContent(); })
            .then(function(conteudo){
              var texto = conteudo.items.map(function(it){ return it.str; }).join(' ');
              return acc + '\n' + texto;
            });
        });
      }, Promise.resolve(''));
    });
  }

  function normalizarTexto(s){
    return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  }

  function parseDataSql(str){
    if(!str) return null;
    var partes = String(str).slice(0,10).split('-');
    if(partes.length!==3) return null;
    return new Date(parseInt(partes[0],10), parseInt(partes[1],10)-1, parseInt(partes[2],10));
  }

  // Validação de CNPJ (dígito verificador padrão) — só pra filtrar sequência
  // de 14 números que apareceu por acaso no PDF (valor, telefone) e não é
  // um CNPJ de verdade.
  function validarCnpj(cnpj){
    var d = (cnpj||'').replace(/\D/g,'');
    if(d.length!==14 || /^(\d)\1{13}$/.test(d)) return false;
    function calc(digs, pesos){
      var soma=0;
      for(var i=0;i<pesos.length;i++) soma += parseInt(digs[i],10)*pesos[i];
      var resto = soma % 11;
      return resto<2 ? 0 : 11-resto;
    }
    var p1=[5,4,3,2,9,8,7,6,5,4,3,2], p2=[6,5,4,3,2,9,8,7,6,5,4,3,2];
    if(calc(d.slice(0,12), p1) !== parseInt(d[12],10)) return false;
    return calc(d.slice(0,13), p2) === parseInt(d[13],10);
  }

  function extrairCnpjs(texto){
    var re = /\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/g, m, out = [];
    while((m = re.exec(texto))){
      var digs = m[0].replace(/\D/g,'');
      if(digs.length===14 && validarCnpj(digs) && out.indexOf(digs)===-1) out.push(digs);
    }
    return out;
  }

  function extrairDatas(texto){
    var re = /(\d{2})\/(\d{2})\/(\d{4})/g, out = [], m;
    while((m = re.exec(texto))){
      var d = parseInt(m[1],10), mo = parseInt(m[2],10), y = parseInt(m[3],10);
      if(d>=1 && d<=31 && mo>=1 && mo<=12 && y>=2020 && y<=2100) out.push({ data:new Date(y,mo-1,d), index:m.index });
    }
    return out;
  }

  function extrairVencimento(texto){
    var datas = extrairDatas(texto);
    if(!datas.length) return null;
    var idxVenc = texto.toUpperCase().indexOf('VENCIMENTO');
    if(idxVenc!==-1){
      var maisPerto = null, menorDist = Infinity;
      datas.forEach(function(d){
        var dist = Math.abs(d.index - idxVenc);
        if(dist<menorDist){ menorDist = dist; maisPerto = d; }
      });
      if(maisPerto && menorDist<200) return maisPerto.data;
    }
    return datas[0].data;
  }

  // Linha digitável (código de barras "digitado" do boleto bancário) tem
  // sempre 47 dígitos, em 3 blocos com dígito verificador próprio (módulo
  // 10 cada) — a mesma conta que qualquer banco/app de pagamento faz antes
  // de aceitar um boleto. Se achamos uma linha de 47 dígitos no texto do
  // PDF e a conta não fecha, é sinal forte de arquivo corrompido/adulterado.
  function extrairLinhaDigitavel(texto){
    var candidatos = texto.match(/[\d][\d.\-\s]{35,80}[\d]/g) || [];
    for(var i=0;i<candidatos.length;i++){
      var soDigitos = candidatos[i].replace(/\D/g,'');
      if(soDigitos.length===47 || soDigitos.length===48) return soDigitos;
    }
    return null;
  }
  function mod10Boleto(digitos){
    var soma = 0, peso = 2;
    for(var i=digitos.length-1;i>=0;i--){
      var mult = parseInt(digitos[i],10)*peso;
      if(mult>9) mult = Math.floor(mult/10) + (mult%10);
      soma += mult;
      peso = peso===2 ? 1 : 2;
    }
    var resto = soma % 10;
    return resto===0 ? 0 : 10-resto;
  }
  function validarLinhaDigitavelMod10(linha){
    if(!linha || linha.length!==47) return null; // formato de concessionária (48) não é o caso aqui — não avalia
    var c1=linha.slice(0,9), dv1=linha[9];
    var c2=linha.slice(10,20), dv2=linha[20];
    var c3=linha.slice(21,31), dv3=linha[31];
    return String(mod10Boleto(c1))===dv1 && String(mod10Boleto(c2))===dv2 && String(mod10Boleto(c3))===dv3;
  }

  function detectarOperadoraNoTexto(texto){
    var textoNorm = normalizarTexto(texto);
    var operadoras = Array.from(new Set(STATE.boletosPainel.map(function(i){return i.operadora;}).filter(Boolean)));
    for(var i=0;i<operadoras.length;i++){
      var opNorm = normalizarTexto(operadoras[i]);
      if(opNorm && textoNorm.indexOf(opNorm)!==-1) return operadoras[i];
    }
    return null;
  }

  function extrairCamposBoleto(texto){
    texto = texto || '';
    var linha = extrairLinhaDigitavel(texto);
    return {
      texto: texto,
      cnpjs: extrairCnpjs(texto),
      vencimento: extrairVencimento(texto),
      linhaDigitavel: linha,
      linhaDigitavelValida: linha ? validarLinhaDigitavelMod10(linha) : null,
      operadoraDetectada: detectarOperadoraNoTexto(texto)
    };
  }

  // Pontua cada contrato que ainda está "na alerta" (esperando boleto deste
  // mês) contra o que foi lido do PDF. CNPJ batendo sozinho já garante
  // confiança alta; nome da empresa/operadora no texto são reforço.
  function candidatosParaBoleto(campos){
    var pendentes = STATE.boletosPainel.filter(function(i){ return !i.cadastroIncompleto; });
    var textoNorm = normalizarTexto(campos.texto);
    var textoNormSemEspaco = textoNorm.replace(/ /g,'');
    return pendentes.map(function(item){
      var score = 0;
      if(campos.cnpjs.length && item.cnpj){
        var cnpjItem = String(item.cnpj).replace(/\D/g,'');
        if(cnpjItem && campos.cnpjs.indexOf(cnpjItem)!==-1) score += 100;
      }
      if(item.operadora){
        var opNorm = normalizarTexto(item.operadora);
        if(opNorm && (textoNorm.indexOf(opNorm)!==-1 || textoNormSemEspaco.indexOf(opNorm.replace(/ /g,''))!==-1)) score += 30;
      }
      if(item.empresa){
        var empNorm = normalizarTexto(item.empresa);
        if(empNorm && textoNorm.indexOf(empNorm)!==-1){ score += 40; }
        else {
          var tokens = empNorm.split(' ').filter(function(t){return t.length>=4;});
          var achados = tokens.filter(function(t){ return textoNorm.indexOf(t)!==-1; });
          if(tokens.length && achados.length) score += Math.round(20*achados.length/tokens.length);
        }
      }
      return { item:item, score:score };
    }).filter(function(c){return c.score>0;}).sort(function(a,b){return b.score-a.score;});
  }

  // Decide o destino de 1 PDF: auto_atribuido (segue o fluxo normal),
  // pendente_revisao (alguém confirma manualmente) ou descartado (vencido,
  // de outra competência, linha digitável inválida, ou duplicado).
  function decidirDestinoInbox(campos, candidatos){
    var top = candidatos[0];
    var hoje = new Date(); hoje.setHours(0,0,0,0);
    if(top && top.score>=100){
      var empresaDetectada = top.item.empresa;
      if(top.item.boletoStatus==='enviado'){
        return { status:'descartado', motivo:'Já existe um boleto enviado pra esse cliente neste mês — descartado pra evitar duplicidade. Se for engano, restaure e reenvie manualmente.', contratoId:top.item.contratoId, competencia:top.item.competenciaAtual, score:top.score, empresaDetectada:empresaDetectada };
      }
      if(campos.linhaDigitavelValida===false){
        return { status:'descartado', motivo:'Linha digitável não confere (dígito verificador não fecha) — pode ser um arquivo corrompido ou falso. Confira antes de restaurar.', contratoId:top.item.contratoId, competencia:top.item.competenciaAtual, score:top.score, empresaDetectada:empresaDetectada };
      }
      if(campos.vencimento && campos.vencimento < hoje){
        return { status:'descartado', motivo:'Boleto vencido (venceu em '+campos.vencimento.toLocaleDateString('pt-BR')+').', contratoId:top.item.contratoId, competencia:top.item.competenciaAtual, score:top.score, empresaDetectada:empresaDetectada };
      }
      if(campos.vencimento){
        var mesEsperado = parseDataSql(top.item.competenciaAtual) || hoje;
        var diffMeses = (campos.vencimento.getFullYear()-mesEsperado.getFullYear())*12 + (campos.vencimento.getMonth()-mesEsperado.getMonth());
        if(diffMeses<0 || diffMeses>1){
          return { status:'descartado', motivo:'Data de vencimento ('+campos.vencimento.toLocaleDateString('pt-BR')+') não bate com o mês esperado — parece ser de outra competência.', contratoId:top.item.contratoId, competencia:top.item.competenciaAtual, score:top.score, empresaDetectada:empresaDetectada };
        }
      }
      return { status:'auto_atribuido', motivo:null, contratoId:top.item.contratoId, competencia:top.item.competenciaAtual, score:top.score, empresaDetectada:empresaDetectada };
    }
    return {
      status:'pendente_revisao',
      motivo: top ? ('Não achei o CNPJ batendo com nenhum contrato — meu melhor palpite ('+top.item.empresa+') está pré-selecionado, confirme.') : 'Não consegui identificar o cliente (CNPJ não encontrado ou ilegível no PDF) — selecione manualmente.',
      contratoId:null, competencia:null, score: top ? top.score : null,
      empresaDetectada: top ? top.item.empresa : null
    };
  }

  function processarArquivoInbox(file){
    var path = 'inbox/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'_'+file.name.replace(/[^A-Za-z0-9._-]/g,'_');
    return sb.storage.from('boletos').upload(path, file).then(function(upRes){
      if(upRes.error) throw upRes.error;
      return extrairTextoPdf(file).catch(function(){ return ''; });
    }).then(function(texto){
      var campos = extrairCamposBoleto(texto);
      var candidatos = candidatosParaBoleto(campos);
      var decisao = decidirDestinoInbox(campos, candidatos);
      var linhaBase = {
        nome_arquivo: file.name, storage_path: path, texto_extraido: (texto||'').slice(0,8000),
        cnpj_detectado: campos.cnpjs[0]||null, empresa_detectada: decisao.empresaDetectada||null,
        operadora_detectada: campos.operadoraDetectada||null,
        vencimento_detectado: campos.vencimento ? (campos.vencimento.getFullYear()+'-'+String(campos.vencimento.getMonth()+1).padStart(2,'0')+'-'+String(campos.vencimento.getDate()).padStart(2,'0')) : null,
        linha_digitavel: campos.linhaDigitavel||null, linha_digitavel_valida: campos.linhaDigitavelValida,
        contrato_id: decisao.contratoId||null, competencia: decisao.competencia||null,
        status: decisao.status, motivo: decisao.motivo||null, score_casamento: decisao.score||null,
        criado_por: perfil.id, updated_at: new Date().toISOString()
      };
      if(decisao.status==='auto_atribuido'){
        return sb.from('boletos').upsert({
          contrato_id: decisao.contratoId, competencia: decisao.competencia, status:'baixado',
          storage_path: path, origem:'manual', criado_por: perfil.id, updated_at: new Date().toISOString()
        }, { onConflict:'contrato_id,competencia' }).select('id').single().then(function(bRes){
          if(bRes.error) throw bRes.error;
          linhaBase.boleto_id = bRes.data.id;
          return sb.from('boletos_inbox').insert(linhaBase);
        }).then(function(){ return decisao.status; });
      }
      return sb.from('boletos_inbox').insert(linhaBase).then(function(){ return decisao.status; });
    });
  }

  function processarLoteInbox(fileList){
    var files = Array.prototype.slice.call(fileList).filter(function(f){ return f.type==='application/pdf' || /\.pdf$/i.test(f.name); });
    if(!files.length){ showToast('Selecione arquivos PDF'); return; }
    boletosCentralProcessando = true;
    boletosCentralProgresso = { feito:0, total:files.length, autoAtribuidos:0, pendentes:0, descartados:0, erros:0 };
    renderContent();
    function proximo(i){
      if(i>=files.length){
        boletosCentralProcessando = false;
        var p = boletosCentralProgresso; boletosCentralProgresso = null;
        showToast(p.autoAtribuidos+' anexado(s) automaticamente, '+p.pendentes+' pra revisão manual'+(p.descartados?', '+p.descartados+' descartado(s)':'')+(p.erros?', '+p.erros+' com erro':''));
        refreshData().then(renderContent);
        return;
      }
      processarArquivoInbox(files[i]).then(function(resultado){
        boletosCentralProgresso.feito++;
        if(resultado==='auto_atribuido') boletosCentralProgresso.autoAtribuidos++;
        else if(resultado==='pendente_revisao') boletosCentralProgresso.pendentes++;
        else if(resultado==='descartado') boletosCentralProgresso.descartados++;
        renderContent();
        proximo(i+1);
      }).catch(function(){
        boletosCentralProgresso.feito++; boletosCentralProgresso.erros++;
        renderContent();
        proximo(i+1);
      });
    }
    proximo(0);
  }

  function boletoStatusInfo(item){
    if(item.cadastroIncompleto) return {label:'Cadastro incompleto', cls:'chip-warn', ic:'alert'};
    if(item.boletoStatus==='enviado') return {label:'Enviado', cls:'chip-ok', ic:'check'};
    if(item.boletoStatus==='enviando') return {label:'Enviando...', cls:'chip-gold', ic:'clock'};
    if(item.boletoStatus==='erro') return {label:'Erro no envio — reenviar', cls:'chip-crit', ic:'alert'};
    if(item.diasRestantes!=null && item.diasRestantes<0) return {label:'Atrasado '+Math.abs(item.diasRestantes)+'d', cls:'chip-crit', ic:'alert'};
    if(item.boletoStatus==='baixado') return {label:'Pronto pra envio', cls:'chip-gold', ic:'clock'};
    if(item.diasRestantes!=null && item.diasRestantes<=7) return {label:'Falta anexar — vence em '+item.diasRestantes+'d', cls:'chip-warn', ic:'clock'};
    return {label:item.diasRestantes!=null ? ('Vence em '+item.diasRestantes+'d') : 'Sem data', cls:'chip-neutral', ic:'clock'};
  }

  function boletosFiltrados(){
    var busca = (boletosBusca||'').toLowerCase().trim();
    return STATE.boletosPainel.filter(function(item){
      if(boletosFiltroOperadora!=='todas' && item.operadora!==boletosFiltroOperadora) return false;
      if(busca && item.empresa.toLowerCase().indexOf(busca)===-1) return false;
      if(boletosFiltroStatus==='todos') return true;
      if(boletosFiltroStatus==='incompleto') return item.cadastroIncompleto;
      if(boletosFiltroStatus==='atrasado') return !item.cadastroIncompleto && item.diasRestantes!=null && item.diasRestantes<0 && item.boletoStatus!=='enviado';
      if(boletosFiltroStatus==='atencao') return !item.cadastroIncompleto && item.diasRestantes!=null && item.diasRestantes>=0 && item.diasRestantes<=7 && item.boletoStatus!=='enviado';
      if(boletosFiltroStatus==='enviado') return item.boletoStatus==='enviado';
      return true;
    });
  }

  function normalizarRamoPlanilha(seg){
    if(!seg) return null;
    var s = String(seg).trim().toUpperCase();
    if(s==='SAÚDE' || s==='SAUDE') return 'saude';
    if(s==='ODONTO' || s==='DENTAL') return 'odonto';
    if(s==='VIDA') return 'vida';
    return null;
  }
  function normalizarVencPlanilha(v){
    var n = parseInt(v, 10);
    return (!isNaN(n) && n>=1 && n<=31) ? n : null;
  }
  function limparLoginPlanilha(v){
    var s = (v==null ? '' : String(v)).trim();
    return (!s || s==='.') ? null : s;
  }
  function limparTextoPlanilha(v){
    var s = (v==null ? '' : String(v)).trim();
    return s || null;
  }

  function parseBoletosPlanilha(file){
    return file.arrayBuffer().then(function(buf){
      var wb = XLSX.read(buf, {type:'array'});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
      if(!rows.length) return [];
      var header = rows[0].map(function(h){ return (h==null?'':String(h)).trim().toUpperCase(); });
      var idx = {};
      BOLETOS_PLANILHA_COLUNAS.forEach(function(col){ idx[col] = header.indexOf(col); });
      // aceita "VENC" sem ponto também
      if(idx['VENC.']===-1) idx['VENC.'] = header.indexOf('VENC');
      var out = [];
      for(var i=1;i<rows.length;i++){
        var r = rows[i];
        if(!r || !r.length) continue;
        var empresa = limparTextoPlanilha(idx['EMPRESA']>=0 ? r[idx['EMPRESA']] : null);
        if(!empresa) continue;
        out.push({
          empresa: empresa,
          operadora: limparTextoPlanilha(idx['OPERADORA']>=0 ? r[idx['OPERADORA']] : null),
          ramo: normalizarRamoPlanilha(idx['SEG']>=0 ? r[idx['SEG']] : null),
          login: limparLoginPlanilha(idx['LOGIN']>=0 ? r[idx['LOGIN']] : null),
          senha: limparTextoPlanilha(idx['SENHA']>=0 ? r[idx['SENHA']] : null),
          venc: normalizarVencPlanilha(idx['VENC.']>=0 ? r[idx['VENC.']] : null),
          emails: limparTextoPlanilha(idx['EMAILS']>=0 ? r[idx['EMAILS']] : null),
          contato: limparTextoPlanilha(idx['CONTATO']>=0 ? r[idx['CONTATO']] : null),
          telefone: limparTextoPlanilha(idx['TELEFONE']>=0 ? r[idx['TELEFONE']] : null),
          cnpj: limparTextoPlanilha(idx['CNPJ']>=0 ? r[idx['CNPJ']] : null),
          procedimento: limparTextoPlanilha(idx['BOLETO']>=0 ? r[idx['BOLETO']] : null)
        });
      }
      return out;
    });
  }

  function montarPreviewBoletosImportacao(nomeArquivo, linhasBrutas){
    var existentesPorCnpj = {}, existentesPorNome = {};
    STATE.empresasAll.forEach(function(e){
      if(e.cnpj) existentesPorCnpj[String(e.cnpj).trim()] = true;
      existentesPorNome[String(e.nome).toLowerCase().trim()] = true;
    });
    var existentesContrato = {};
    STATE.boletosPainel.forEach(function(i){
      existentesContrato[[(i.cnpj||i.empresa).toLowerCase().trim(), i.operadora, i.ramo, i.diaVencimento].join('|')] = true;
    });
    var novos=0, existentes=0, invalidos=0;
    var linhas = linhasBrutas.map(function(l){
      if(!l.operadora){ invalidos++; return Object.assign({}, l, {valido:false, jaExiste:false, motivoInvalido:'Sem operadora'}); }
      var key = [(l.cnpj||l.empresa).toLowerCase().trim(), l.operadora, l.ramo, l.venc].join('|');
      var empresaJaExiste = l.cnpj ? !!existentesPorCnpj[l.cnpj] : !!existentesPorNome[l.empresa.toLowerCase().trim()];
      var contratoJaExiste = !!existentesContrato[key];
      if(empresaJaExiste && contratoJaExiste){ existentes++; return Object.assign({}, l, {valido:true, jaExiste:true}); }
      novos++;
      return Object.assign({}, l, {valido:true, jaExiste:false});
    });
    return { nomeArquivo:nomeArquivo, linhas:linhas, novos:novos, existentes:existentes, invalidos:invalidos };
  }

    var novas = boletosImportPreview.linhas.filter(function(l){ return l.valido && !l.jaExiste; });
    if(!novas.length){ boletosImportPreview = null; renderContent(); return; }
    var okCount = 0, errCount = 0;

      if(i>=novas.length){
        showToast(okCount+' importado(s)'+(errCount?', '+errCount+' com erro':''));
        boletosImportPreview = null;
        refreshData().then(renderContent);
        return;
      }
      var l = novas[i];
      buscarOuCriarEmpresa(l).then(function(empresaId){
        return sb.from('contratos').insert({
          empresa_id: empresaId, operadora: l.operadora, ramo: l.ramo, dia_vencimento_boleto: l.venc,
          portal_login: l.login, portal_senha: l.senha, portal_procedimento: l.procedimento,
          email_cobranca: l.emails, contato_nome: l.contato, telefone_contato: l.telefone,
          tipo_negocio: 'boleto', valor_mensal: 0, dia_aniversario: l.venc||1, mes_aniversario: (new Date()).getMonth()+1
        });
      }).then(function(){ okCount++; }).catch(function(){ errCount++; }).then(function(){ processarProxima(i+1); });
    }
    processarProxima(0);
  }

  function buscarOuCriarEmpresa(l){
    var existente = STATE.empresasAll.find(function(e){
      return l.cnpj ? (e.cnpj && String(e.cnpj).trim()===l.cnpj) : (String(e.nome).toLowerCase().trim()===l.empresa.toLowerCase().trim());
    });
    if(existente) return Promise.resolve(existente.id);
    return sb.from('empresas').insert({ nome:l.empresa, cnpj:l.cnpj }).select('id').single().then(function(res){
      if(res.error) throw res.error;
      STATE.empresasAll.push({id:res.data.id, nome:l.empresa, cnpj:l.cnpj});
      return res.data.id;
    });
  }

  function toISODate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmtDatePtCurto(iso){ var d=new Date(iso+'T00:00:00'); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0'); }
  function fmtMoneySigned(n){
    var sign = n<0 ? '-' : '';
    return sign+'R$ '+Math.abs(n).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtDateHoraBR(ts){
    if(!ts) return '—';
    var d = new Date(ts);
    if(isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }
  // Semanas segunda-sexta que cobrem o mês inteiro (mesmo recorte usado na
  // planilha) — a primeira pode começar no mês anterior, a última pode
  // terminar no mês seguinte.
  function weeksForMonth(refMesStr){
    var d = new Date(refMesStr+'T00:00:00');
    var year = d.getFullYear(), month = d.getMonth()+1;
    var first = new Date(year, month-1, 1);
    var last = new Date(year, month, 0);
    var cur = new Date(first);
    var dow = cur.getDay();
    cur.setDate(cur.getDate() + (dow===0 ? -6 : 1-dow));
    var weeks = [];
    while(cur <= last){
      var start = new Date(cur);
      var end = new Date(cur); end.setDate(end.getDate()+4);
      weeks.push({ inicio: toISODate(start), fim: toISODate(end) });
      cur.setDate(cur.getDate()+7);
    }
    return weeks;
  }

  // Gera o recibo em PDF, no mesmo desenho (faixas cinza, semana a semana,
  // subtotal e total) usado na tela — pra imprimir e arquivar.
  function gerarPdfRecibo(r){
    if(!window.jspdf || !window.jspdf.jsPDF){ showToast('PDF ainda carregando — tenta de novo em 1 segundo'); return; }
    var lancamentos = lancamentosDoRecibo(r.id);
    var weeks = weeksForMonth(r.referenciaMes);
    var total = lancamentos.reduce(function(s,l){return s+l.valor;},0);
    var refDate = new Date(r.referenciaMes+'T00:00:00');
    var ultimoDia = new Date(refDate.getFullYear(), refDate.getMonth()+1, 0);
    var refLabel = r.referenciaMes.slice(0,7).replace('-','.');

    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit:'mm', format:'a4' });
    var pageW = doc.internal.pageSize.getWidth();
    var marginX = 15;
    var contentW = pageW - marginX*2;
    var valorW = 34;
    var descW = contentW - valorW;
    var INK = [21,36,32];
    var GREY_BAR = [166,166,166];
    var GREY_BAND = [217,217,217];

    var y = 16;
    doc.setTextColor.apply(doc, INK);
    doc.setFont('helvetica','normal');
    doc.setFontSize(9.5);
    doc.text(String(ultimoDia.getDate())+'   '+MESES[ultimoDia.getMonth()]+'   '+ultimoDia.getFullYear(), marginX, y);
    y += 5;

    var boxTop = y;
    doc.setFillColor.apply(doc, GREY_BAR);
    doc.rect(marginX, y, contentW, 8, 'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(10.5);
    doc.text('RECIBO Nº '+refLabel, marginX+3, y+5.4);
    doc.text('VALOR', marginX+contentW-20, y+5.4);
    y += 8;

    doc.setFont('helvetica','normal');
    doc.setFontSize(9.5);
    y += 7;
    doc.text('Recebi (emos) de: ', marginX+3, y);
    var larguraLabel = doc.getTextWidth('Recebi (emos) de: ');
    doc.setFont('helvetica','bold');
    doc.text('Corretora de Seguros Panacea', marginX+3+larguraLabel, y);
    y += 5;

    var body = [];
    var rowKinds = [];
    weeks.forEach(function(w){
      var itens = lancamentos.filter(function(l){return l.semanaInicio===w.inicio;});
      var subtotal = itens.reduce(function(s,l){return s+l.valor;},0);
      body.push([{ content:'recebido '+fmtDatePtCurto(w.inicio)+' - '+fmtDatePtCurto(w.fim), colSpan:2, styles:{ fillColor:GREY_BAND, fontStyle:'bold', halign:'center' } }]);
      rowKinds.push('semana');
      itens.forEach(function(l){
        body.push([ l.descricao, fmtMoneySigned(l.valor) ]);
        rowKinds.push('item');
      });
      body.push([
        { content:'SUBTOTAL recebido na semana', styles:{ fillColor:GREY_BAND, fontStyle:'bold' } },
        { content: fmtMoneySigned(subtotal), styles:{ fillColor:GREY_BAND, fontStyle:'bold', halign:'right' } }
      ]);
      rowKinds.push('subtotal');
    });
    body.push([
      { content:'TOTAL', styles:{ fontStyle:'bold', fontSize:10 } },
      { content: fmtMoney(total), styles:{ fontStyle:'bold', fontSize:10, halign:'right' } }
    ]);
    rowKinds.push('total');

    doc.autoTable({
      startY: y,
      margin: { left: marginX, right: marginX },
      tableWidth: contentW,
      theme: 'plain',
      styles: { font:'helvetica', fontSize:9, textColor:INK, cellPadding:{top:1.6,bottom:1.6,left:3,right:3}, lineColor:[210,210,210], lineWidth:0.15, overflow:'linebreak' },
      columnStyles: { 0:{ cellWidth:descW }, 1:{ cellWidth:valorW, halign:'right' } },
      body: body,
      didParseCell: function(data){
        if(rowKinds[data.row.index]==='total' && data.column.index===1){
          data.cell.styles.lineWidth = 0.4;
          data.cell.styles.lineColor = INK;
        }
      }
    });

    y = doc.lastAutoTable.finalY + 6;
    doc.setFontSize(8.5);
    doc.setFont('helvetica','italic');
    doc.text('e para clareza firmo (amos) a presente.', marginX+3, y);
    y += 5.5;
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.text('São Paulo , '+ultimoDia.getDate()+' de '+MESES[ultimoDia.getMonth()]+' de '+ultimoDia.getFullYear(), marginX+3, y);
    y += 6;
    doc.text('Nome: ', marginX+3, y);
    var lnome = doc.getTextWidth('Nome: ');
    doc.setFont('helvetica','bold');
    doc.text(r.colaboradorNome, marginX+3+lnome, y);
    doc.setFont('helvetica','normal');
    doc.text('CNPJ: —', marginX+contentW-28, y);
    y += 6;
    doc.setFontSize(8.3);
    var legal = doc.splitTextToSize('Prestação de serviços como promoção de vendas, contatos comerciais, entre outras atividades. 1x ao mês emitir Nota para a PANACEA dos valores recebidos totais.', contentW-6);
    doc.text(legal, marginX+3, y);
    y += legal.length*4 + 8;

    if(r.status==='confirmado'){
      doc.setFont('helvetica','bold');
      doc.setFontSize(9);
      doc.text('Confirmado digitalmente por '+r.colaboradorNome+' em '+r.confirmadoEm, marginX+3, y);
      y += 6;
    } else {
      doc.setDrawColor(150,150,150);
      doc.setLineWidth(0.2);
      doc.line(marginX+contentW-70, y, marginX+contentW-3, y);
      y += 4.5;
      doc.setFont('helvetica','bold');
      doc.setFontSize(8.5);
      var lblAss = 'ASSINATURA';
      doc.text(lblAss, marginX+contentW-70 + (67 - doc.getTextWidth(lblAss))/2, y);
      y += 4;
    }

    var boxBottom = y + 3;
    doc.setDrawColor(20,20,20);
    doc.setLineWidth(0.5);
    doc.rect(marginX, boxTop, contentW, boxBottom-boxTop);

    var nomeArquivo = 'Recibo_'+r.colaboradorNome.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_')+'_'+refLabel.replace('.','-')+'.pdf';
    doc.save(nomeArquivo);
  }

      var pb = (b.status==='ok'||b.status==='cancelado') ? 1 : 0;
