  function montarPreviewImportacao(operadora, nomeArquivo, linhas){
    var porIdentificador = {};
    STATE.comissaoAcompanhamentos.forEach(function(a){ if(a.operadora===operadora) porIdentificador[a.identificador] = a; });
    var vistos = {};
    var classificadas = linhas.map(function(l){
      var existente = porIdentificador[l.identificador];
      vistos[l.identificador] = true;
      var statusPrevisto, diferenca = null;
      if(!existente){
        statusPrevisto = 'novo';
      } else if(existente.status==='pendente_baseline' || existente.valorMensalidade==null || existente.percentualComissao==null){
        statusPrevisto = 'pendente_baseline';
      } else {
        var esperado = Math.round(existente.valorMensalidade * existente.percentualComissao / 100 * 100) / 100;
        diferenca = Math.round((l.valorComissao - esperado) * 100) / 100;
        statusPrevisto = Math.abs(diferenca) <= TOLERANCIA_COMISSAO ? 'ok' : 'valor_divergente';
      }
      return { linha: l, acompanhamentoId: existente ? existente.id : null, statusPrevisto: statusPrevisto, diferenca: diferenca };
    });
    var faltantes = STATE.comissaoAcompanhamentos.filter(function(a){
      return a.operadora===operadora && a.status!=='cancelado' && !vistos[a.identificador];
    });
    return {
      operadora: operadora, nomeArquivo: nomeArquivo, classificadas: classificadas, faltantes: faltantes,
      resumo: {
        novos: classificadas.filter(function(c){return c.statusPrevisto==='novo';}).length,
        pendentes: classificadas.filter(function(c){return c.statusPrevisto==='pendente_baseline';}).length,
        ok: classificadas.filter(function(c){return c.statusPrevisto==='ok';}).length,
        divergentes: classificadas.filter(function(c){return c.statusPrevisto==='valor_divergente';}).length,
        faltantes: faltantes.length,
        totalComissao: linhas.reduce(function(s,l){return s+(l.valorComissao||0);}, 0)
      }
    };
  }

  function confirmarImportacaoComissao(){
    var p = conciliacaoPreview;
    var agora = new Date().toISOString();
    var competenciaLote = modaCompetencia(p.classificadas.map(function(c){return c.linha;}));
    var novosPorIdentificador = {};
    var criarNovos = p.classificadas.filter(function(c){ return !c.acompanhamentoId; });
    var criarPromise = criarNovos.length
      ? sb.from('comissao_acompanhamentos').insert(criarNovos.map(function(c){
          return { operadora: p.operadora, identificador: c.linha.identificador, nome_cliente: c.linha.nomeCliente, status: 'pendente_baseline' };
        })).select().then(function(res){
          if(res.error) throw res.error;
          (res.data||[]).forEach(function(row){ novosPorIdentificador[row.identificador] = row; });
        })
      : Promise.resolve();

    return criarPromise.then(function(){
      return sb.from('comissao_relatorios').insert({
        operadora: p.operadora, nome_arquivo: p.nomeArquivo, competencia_detectada: competenciaLote,
        total_linhas: p.classificadas.length, total_valor_comissao: p.resumo.totalComissao, enviado_por: perfil.id
      }).select().single();
    }).then(function(relRes){
      if(relRes.error) throw relRes.error;
      var relatorioId = relRes.data.id;
      var linhasInsert = [], updates = [], historicos = [];
      p.classificadas.forEach(function(c){
        var acompId = c.acompanhamentoId || (novosPorIdentificador[c.linha.identificador] && novosPorIdentificador[c.linha.identificador].id);
        if(!acompId) return;
        linhasInsert.push({
          relatorio_id: relatorioId, acompanhamento_id: acompId, parcela_numero: c.linha.parcelaNumero,
          competencia: c.linha.competencia, valor_base: c.linha.valorBase, percentual: c.linha.percentual,
          valor_comissao: c.linha.valorComissao, data_pagamento: c.linha.dataPagamento, divergencia: c.diferenca
        });
        var novoStatus = c.statusPrevisto==='novo' ? 'pendente_baseline' : c.statusPrevisto;
        updates.push({ id: acompId, payload: {
          status: novoStatus, ultima_parcela_numero: c.linha.parcelaNumero, ultima_competencia: c.linha.competencia,
          ultimo_valor_base: c.linha.valorBase, ultimo_percentual: c.linha.percentual, ultimo_valor_comissao: c.linha.valorComissao,
          ultima_data_relatorio: c.linha.dataPagamento || new Date().toISOString().slice(0,10), updated_at: agora
        }});
        if(novoStatus==='valor_divergente'){
          historicos.push({ entidade_tipo:'comissao', entidade_id:acompId, created_by:perfil.id, texto:
            'Relatório de '+(c.linha.competencia||'—')+': recebido '+fmtMoney(c.linha.valorComissao)+', esperado aproximadamente '+fmtMoney(c.linha.valorComissao-c.diferenca)+' — diferença de '+fmtMoney(Math.abs(c.diferenca))+'.' });
        } else if(c.statusPrevisto==='novo'){
          historicos.push({ entidade_tipo:'comissao', entidade_id:acompId, created_by:perfil.id, texto:
            'Primeira parcela vista neste relatório ('+p.nomeArquivo+') — falta cadastrar o valor da mensalidade e o percentual de comissão.' });
        } else if(novoStatus==='ok'){
          historicos.push({ entidade_tipo:'comissao', entidade_id:acompId, created_by:perfil.id, texto:
            'Parcela de '+(c.linha.competencia||'—')+' conferida: '+fmtMoney(c.linha.valorComissao)+', dentro do esperado.' });
        }
      });
      p.faltantes.forEach(function(a){
        updates.push({ id: a.id, payload: { status:'parcela_faltante', updated_at: agora } });
        historicos.push({ entidade_tipo:'comissao', entidade_id:a.id, created_by:perfil.id, texto:
          'Não apareceu no relatório '+p.nomeArquivo+' ('+(competenciaLote||'—')+') — última parcela vista foi '+(a.ultimaCompetencia||'—')+'.' });
      });

      var linhasPromise = linhasInsert.length ? sb.from('comissao_linhas').insert(linhasInsert) : Promise.resolve();
      var updatesPromise = Promise.all(updates.map(function(u){ return sb.from('comissao_acompanhamentos').update(u.payload).eq('id', u.id); }));
      var historicosPromise = historicos.length ? sb.from('historico').insert(historicos) : Promise.resolve();
      return Promise.all([linhasPromise, updatesPromise, historicosPromise]);
    }).then(function(){
      showToast('Relatório importado');
      conciliacaoPreview = null; conciliacaoMode = 'lista';
      return refreshData();
    }).then(function(){
      renderAppBar(); renderBottomTabbar(); renderContent();
    });
  }

  function leadContextoParaIa(lead){
    var stage = LEAD_STAGES.find(function(s){return s.key===lead.etapa;});
    return {
      nome: lead.nome, empresa: lead.empresa!=='—' ? lead.empresa : null,
      tipoNegocio: lead.tipo!=='—' ? lead.tipo : null, valorEstimado: lead.valor>0 ? lead.valor : null,
      etapa: stage ? stage.label : null
    };
  }

  function openRegistrarAtendimento(leadId){
    var lead = STATE.leads.find(function(l){return l.id===leadId;});
    if(!lead) return;
    var html = '<h3>Registrar atendimento</h3>'+
      '<p class="row-sub" style="margin-bottom:.8rem">Conta rapidamente como foi essa interação com <b>'+lead.nome+'</b> — o coach de IA vai te ajudar a melhorar a abordagem com esse lead.</p>'+
      '<form id="atendimentoFeedbackForm">'+
        '<div class="field"><label>O que aconteceu nessa conversa?</label><textarea name="feedback" rows="4" placeholder="Ex: liguei apresentando o plano, ele achou o valor alto perto do que paga hoje e disse que ia pensar com a esposa..." required></textarea></div>'+
        '<button type="submit" class="btn btn-primary">'+ic('sparkles')+' Enviar pro coach de IA</button>'+
      '</form>';
    openSheet(html);
    var form = document.getElementById('atendimentoFeedbackForm');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      var feedbackTexto = form.feedback.value.trim();
      sb.from('lead_atendimentos').insert({ lead_id: leadId, vendedor_id: perfil.id, feedback_texto: feedbackTexto })
        .select().single().then(function(res){
          if(res.error) throw res.error;
          chatSession = {
            atendimentoId: res.data.id, leadId: leadId, leadNome: lead.nome, feedbackTexto: feedbackTexto,
            mensagens: [], perguntasFeitas: 0, concluido: false, resultado: null, aguardandoIa: true, somenteLeitura: false, erro: false
          };
          renderChatSheet();
          return avancarConversaIa(lead);
        }).catch(function(){ btn.disabled=false; showToast('Não deu — tente de novo'); });
    });
  }

  function avancarConversaIa(lead){
    chatSession.aguardandoIa = true;
    chatSession.erro = false;
    renderChatSheet();
    return sb.functions.invoke('comercial-ia', { body: {
      leadContexto: leadContextoParaIa(lead),
      feedbackTexto: chatSession.feedbackTexto,
      historicoConversa: chatSession.mensagens.map(function(m){ return {papel:m.papel, texto:m.texto}; }),
      perguntasFeitas: chatSession.perguntasFeitas
    }}).then(function(res){
      if(res.error) throw res.error;
      var resp = res.data;
      if(resp && resp.tipo==='pergunta' && resp.texto){
        var ordem = chatSession.mensagens.length + 1;
        return sb.from('lead_atendimento_mensagens').insert({ atendimento_id: chatSession.atendimentoId, papel:'ia', texto: resp.texto, ordem: ordem })
          .then(function(){ return sb.from('lead_atendimentos').update({ total_perguntas_ia: chatSession.perguntasFeitas+1, updated_at: new Date().toISOString() }).eq('id', chatSession.atendimentoId); })
          .then(function(){
            chatSession.mensagens.push({papel:'ia', texto:resp.texto});
            chatSession.perguntasFeitas += 1;
            chatSession.aguardandoIa = false;
            renderChatSheet();
          });
      }
      var resultado = {
        resumo: (resp&&resp.resumo) || '', sugestoes: (resp&&resp.sugestoes) || '',
        posicionamento: (resp&&resp.posicionamento) || '', tecnica: (resp&&resp.tecnica) || ''
      };
      return sb.from('lead_atendimentos').update({
        status:'concluido', resumo_final: resultado.resumo, sugestoes_finais: resultado.sugestoes,
        posicionamento_sugerido: resultado.posicionamento, tecnica_recomendada: resultado.tecnica, updated_at: new Date().toISOString()
      }).eq('id', chatSession.atendimentoId)
        .then(function(){
          var textoHistorico = 'Atendimento registrado.' + (resultado.tecnica ? ' Técnica sugerida pela IA: '+resultado.tecnica+'.' : '') + (resultado.posicionamento ? ' Posicionamento: '+resultado.posicionamento : '');
          return addHistorico('lead', chatSession.leadId, textoHistorico);
        })
        .then(function(){
          chatSession.concluido = true;
          chatSession.resultado = resultado;
          chatSession.aguardandoIa = false;
          renderChatSheet();
          return refreshData();
        });
    }).catch(function(){
      chatSession.aguardandoIa = false;
      chatSession.erro = true;
      renderChatSheet();
    });
  }

  function handleResponderAtendimento(e){
    e.preventDefault();
    if(!chatSession || chatSession.aguardandoIa) return;
    var form = e.target;
    var texto = form.resposta.value.trim();
    if(!texto) return;
    var lead = STATE.leads.find(function(l){return l.id===chatSession.leadId;});
    var ordem = chatSession.mensagens.length + 1;
    chatSession.aguardandoIa = true;
    renderChatSheet();
    sb.from('lead_atendimento_mensagens').insert({ atendimento_id: chatSession.atendimentoId, papel:'vendedor', texto: texto, ordem: ordem })
      .then(function(){
        chatSession.mensagens.push({papel:'vendedor', texto:texto});
        return avancarConversaIa(lead);
      }).catch(function(){ chatSession.aguardandoIa=false; chatSession.erro=true; renderChatSheet(); });
  }

  function renderChatSheet(){
    if(!chatSession) return;
    var thread = chatSession.mensagens.map(function(m){
      return '<div class="coach-msg '+m.papel+'">'+m.texto+'</div>';
    }).join('');

    var bubbleHtml;
    if(chatSession.aguardandoIa){
      bubbleHtml = '<div class="coach-bubble thinking"><span class="coach-dot"></span><span class="coach-dot"></span><span class="coach-dot"></span></div>';
    } else if(chatSession.erro){
      bubbleHtml = '<div class="coach-bubble">Não consegui falar com a IA agora. Pode tentar de novo?</div>';
    } else if(chatSession.concluido){
      bubbleHtml = '<div class="coach-bubble">Prontinho — separei umas ideias pra esse lead aqui embaixo.</div>';
    } else {
      var ultima = chatSession.mensagens.length ? chatSession.mensagens[chatSession.mensagens.length-1] : null;
      bubbleHtml = '<div class="coach-bubble">'+((ultima&&ultima.papel==='ia') ? ultima.texto : 'Vamos conversar sobre esse atendimento.')+'</div>';
    }

    var finalHtml = '';
    if(chatSession.concluido && chatSession.resultado){
      var r = chatSession.resultado;
      finalHtml = '<div class="coach-final">'+
        (r.resumo ? '<div><div class="lbl">Resumo</div><div class="tx">'+r.resumo+'</div></div>' : '')+
        (r.posicionamento ? '<div><div class="lbl">Posicionamento sugerido</div><div class="tx">'+r.posicionamento+'</div></div>' : '')+
        (r.sugestoes ? '<div><div class="lbl">Sugestões de abordagem</div><div class="tx">'+r.sugestoes+'</div></div>' : '')+
        (r.tecnica ? '<div><div class="lbl">Técnica recomendada</div><div class="tx">'+ic('sparkles')+' '+r.tecnica+'</div></div>' : '')+
      '</div>';
    }

    var progresso = (!chatSession.concluido && !chatSession.somenteLeitura) ? '<div class="coach-progress">Pergunta '+Math.min(chatSession.perguntasFeitas, 6)+' de até 6</div>' : '';

    var formHtml;
    if(chatSession.concluido){
      formHtml = '<button type="button" class="btn btn-ghost" id="atendimentoFecharBtn" style="margin-top:.5rem">Fechar</button>';
    } else if(chatSession.somenteLeitura){
      formHtml = '<p class="row-sub" style="margin-top:.3rem">Aguardando resposta do vendedor.</p>'+
        '<button type="button" class="btn btn-ghost" id="atendimentoFecharBtn" style="margin-top:.5rem">Fechar</button>';
    } else {
      formHtml = '<form id="atendimentoRespostaForm" style="display:flex; flex-direction:column; gap:.5rem; margin-top:.3rem">'+
        '<textarea name="resposta" rows="2" placeholder="Sua resposta..." required '+(chatSession.aguardandoIa?'disabled':'')+'></textarea>'+
        '<button type="submit" class="btn btn-primary" '+(chatSession.aguardandoIa?'disabled':'')+'>'+ic('chev')+' Responder</button>'+
      '</form>';
    }

    var html = '<h3>Coach de vendas</h3>'+
      '<p class="row-sub" style="margin-bottom:.7rem">Sobre o atendimento a <b>'+chatSession.leadNome+'</b></p>'+
      '<div class="coach-wrap">'+
        '<div class="coach-header"><div class="coach-avatar">'+MASCOTE_SVG+'</div>'+bubbleHtml+'</div>'+
        (thread ? '<div class="coach-thread">'+thread+'</div>' : '')+
        progresso+
        finalHtml+
        formHtml+
      '</div>';
    openSheet(html);

    var respForm = document.getElementById('atendimentoRespostaForm');
    if(respForm) respForm.addEventListener('submit', handleResponderAtendimento);
    var fecharBtn = document.getElementById('atendimentoFecharBtn');
    if(fecharBtn) fecharBtn.addEventListener('click', function(){ chatSession=null; closeSheet(); renderContent(); });
  }

  function openAtendimentoDetail(id){
    var a = STATE.leadAtendimentos.find(function(x){return x.id===id;});
    if(!a) return;
    var podeResponder = a.vendedorId===perfil.id && a.status==='em_andamento';
    chatSession = {
      atendimentoId:a.id, leadId:a.leadId, leadNome:a.leadNome, feedbackTexto:a.feedbackTexto,
      mensagens: a.mensagens.map(function(m){return {papel:m.papel, texto:m.texto};}),
      perguntasFeitas: a.totalPerguntasIa, concluido: a.status==='concluido',
      resultado: a.status==='concluido' ? {resumo:a.resumoFinal, sugestoes:a.sugestoesFinais, posicionamento:a.posicionamentoSugerido, tecnica:a.tecnicaRecomendada} : null,
      aguardandoIa:false, erro:false, somenteLeitura: a.status==='em_andamento' && !podeResponder
    };
    renderChatSheet();
  }

  function viewCoachingIa(){

    });
    var emAndamentoCount = todos.filter(function(a){return a.status==='em_andamento';}).length;
    var chipsFiltro = [
      {k:'todos', l:'Todos ('+todos.length+')'},
      {k:'em_andamento', l:'Em andamento ('+emAndamentoCount+')'},

    ].map(function(c){

    }).join(' ');
    var listHtml = itens.length ? itens.map(function(a){
      var statusChip = a.status==='concluido' ? '<span class="chip chip-ok">'+ic('check')+' Concluído</span>' : '<span class="chip chip-warn">'+ic('clock')+' Em andamento</span>';
      return '<button class="row-card" data-open="atendimento:'+a.id+'" style="margin-bottom:.6rem; display:block; width:100%; text-align:left"><div class="row-top">'+

  /* ============== VIEW: Painéis do financeiro (comissões, reajuste, inadimplência) ============== */
  function viewPaineisFinanceiro(){
    if(painelFinMode==='novo-contrato') return viewNovoContrato();
    if(painelFinMode==='novo-segurado') return viewNovoSegurado();
    if(painelFinMode==='nova-comissao') return viewNovaComissao();

  function barChartHtml(items){
    // items: [{label, previsto, recebido}]
    if(!items.length) return '<div class="empty-col">Nada lançado ainda.</div>';
    var maxValor = Math.max(1, items.reduce(function(m,it){return Math.max(m, it.previsto, it.recebido);},0));
    return '<div class="bar-legend"><span><span class="sw" style="background:var(--teal-900)"></span>Recebido</span><span><span class="sw" style="background:var(--warning-tint)"></span>Previsto</span></div>'+
      items.map(function(it){
        var pctPrevisto = Math.round((it.previsto/maxValor)*100);
        var pctRecebido = Math.round((it.recebido/maxValor)*100);
        return '<div class="bar-row"><div class="bar-label" title="'+it.label+'">'+it.label+'</div>'+
          '<div class="bar-track"><div class="bar-fill-prev" style="width:'+pctPrevisto+'%"></div><div class="bar-fill-rec" style="width:'+pctRecebido+'%"></div></div>'+
          '<div class="bar-vals mono">'+fmtMoney(it.recebido)+'</div></div>';
      }).join('');
  }

  function viewPainelComissoes(){
    var porOperadora = {};
    STATE.comissoes.forEach(function(c){
      if(!porOperadora[c.operadora]) porOperadora[c.operadora] = {previsto:0, recebido:0};
      porOperadora[c.operadora].previsto += c.valorPrevisto;
      porOperadora[c.operadora].recebido += c.valorRecebido;
    });
    var itens = Object.keys(porOperadora).sort(function(a,b){ return porOperadora[b].previsto - porOperadora[a].previsto; })
      .map(function(o){ return {label:o, previsto:porOperadora[o].previsto, recebido:porOperadora[o].recebido}; });

    var rows = STATE.comissoes.slice(0, 40);
    var listHtml = rows.length ? rows.map(function(c){
      var statusChip = c.status==='recebido'
        ? '<span class="chip chip-ok">'+ic('check')+' Recebido em '+c.recebidoEm+'</span>'
        : c.status==='atrasado'
          ? '<span class="chip chip-crit">'+ic('alert')+' Atrasado</span>'
          : '<span class="chip chip-warn">'+ic('clock')+' Previsto</span>';
      var actions = c.status!=='recebido' ? '<button class="btn btn-primary" data-comissao-receber="'+c.id+'">'+ic('check')+' Marcar recebido</button>' : '';
      return '<div class="row-card" style="cursor:default; margin-bottom:.6rem"><div class="row-top">'+
        '<div><div class="row-title">'+c.operadora+' · '+c.empresaNome+'</div>'+
        '<div class="row-sub mono">'+c.referenciaLabel+' · '+fmtMoney(c.valorPrevisto)+(c.vendedorNome!=='—'?' · '+c.vendedorNome:'')+'</div></div>'+
        statusChip+'</div>'+(actions?'<div class="btn-row">'+actions+'</div>':'')+'</div>';
    }).join('') : '<div class="empty-col">Nenhum lançamento ainda.</div>';

    return '<div class="content-pad">'+
      '<div style="display:flex; justify-content:space-between; align-items:center; gap:.6rem; margin-bottom:.7rem">'+
        '<div class="section-label" style="margin-bottom:0">Previsto × recebido por operadora</div>'+
        '<button class="btn btn-primary" style="width:auto" data-painel-fin-mode="nova-comissao">'+ic('plus')+' Nova comissão</button>'+
      '</div>'+
      '<div class="row-card" style="cursor:default; margin-bottom:1rem">'+barChartHtml(itens)+'</div>'+
      '<div class="section-label">Lançamentos recentes</div>'+
      listHtml+
    '</div>';
  }

  function viewPainelReajustes(){
    var sorted = STATE.contratos.slice().sort(function(a,b){
      return diasAteAniversario(a.diaAniversario,a.mesAniversario) - diasAteAniversario(b.diaAniversario,b.mesAniversario);
    });
    var avisoChips = [15,30,60,90].map(function(n){
      return '<button class="chip '+(reajusteAvisoDias===n?'chip-gold':'chip-neutral')+'" style="border:none;cursor:pointer" data-reajuste-aviso="'+n+'">'+n+'d</button>';
    }).join(' ');
    var dentroDoAviso = sorted.filter(function(c){ return diasAteAniversario(c.diaAniversario,c.mesAniversario) <= reajusteAvisoDias; }).length;
    var listHtml = sorted.length ? sorted.map(function(c){
      var dias = diasAteAniversario(c.diaAniversario,c.mesAniversario);
      var cls = dias<=7 ? 'chip-crit' : dias<=reajusteAvisoDias ? 'chip-warn' : 'chip-ok';
      return '<button class="row-card" data-open="contrato:'+c.id+'" style="margin-bottom:.6rem; display:block; width:100%; text-align:left"><div class="row-top">'+
        '<div><div class="row-title">'+c.empresaNome+' · '+c.operadora+'</div>'+
        '<div class="row-sub mono">'+fmtMoney(c.valorMensal)+'/mês · aniversário dia '+c.diaAniversario+' de '+MESES[c.mesAniversario-1]+'</div></div>'+
        '<span class="chip '+cls+'">'+ic('clock')+' em '+dias+'d</span></div></button>';
    }).join('') : '<div class="empty-col">Nenhum contrato cadastrado ainda.</div>';

    return '<div class="content-pad">'+
      '<div style="display:flex; justify-content:space-between; align-items:center; gap:.6rem; margin-bottom:.5rem">'+
        '<div class="section-label" style="margin-bottom:0">Calendário de reajuste</div>'+
        '<button class="btn btn-primary" style="width:auto" data-painel-fin-mode="novo-contrato">'+ic('plus')+' Novo contrato</button>'+
      '</div>'+
      '<p class="row-sub" style="margin-bottom:.5rem">Avisar com quantos dias de antecedência?</p>'+
      '<div style="display:flex;gap:.4rem;margin-bottom:.8rem;flex-wrap:wrap">'+avisoChips+'</div>'+
      (dentroDoAviso ? '<div class="pending-banner">'+ic('alert')+'<span>'+dentroDoAviso+' contrato(s) fazendo aniversário nos próximos '+reajusteAvisoDias+' dias.</span></div>' : '')+
      '<div class="section-label" style="margin-top:.8rem">Contratos ativos</div>'+
      listHtml+
    '</div>';
  }

  function viewPainelVendedores(){
    var porVendedor = {};
    STATE.comissoes.forEach(function(c){
      var key = c.vendedorId || '—';
      if(!porVendedor[key]) porVendedor[key] = {nome:c.vendedorNome, previsto:0, recebido:0};
      porVendedor[key].previsto += c.valorPrevisto;
      porVendedor[key].recebido += c.valorRecebido;
    });
    var itens = Object.keys(porVendedor).sort(function(a,b){ return porVendedor[b].recebido - porVendedor[a].recebido; })
      .map(function(k){ return {label:porVendedor[k].nome, previsto:porVendedor[k].previsto, recebido:porVendedor[k].recebido}; });
    return '<div class="content-pad">'+
      '<div class="section-label">Comissão gerada por vendedor</div>'+
      '<p class="row-sub" style="margin-bottom:.7rem">Soma das comissões vinculadas aos contratos de cada vendedor.</p>'+

    var notaForm = document.getElementById('pvNotaForm');
    if(notaForm){
      notaForm.addEventListener('submit', function(e){
        e.preventDefault();
        var texto = notaForm.nota.value.trim();
        if(!texto) return;
        var btn = notaForm.querySelector('button[type=submit]');
        btn.disabled = true;
        addHistorico('solicitacao', id, texto, false)
          .then(function(){ showToast('Nota adicionada'); closeSheet(); return refreshData(); })
          .then(function(){ renderAppBar(); renderBottomTabbar(); renderContent(); })
          .catch(function(){ btn.disabled=false; showToast('Não deu — tente de novo'); });
      });
    }

    var resolveInput = document.getElementById('resolvePendInput');
    if(resolveInput){
      resolveInput.addEventListener('change', function(){
        var file = resolveInput.files && resolveInput.files[0];
        if(!file) return;
        var path = 'solicitacao_'+id+'/'+Date.now()+'_'+file.name;
        sb.storage.from('documentos').upload(path, file).then(function(upRes){
          if(upRes.error){ showToast('Não deu pra enviar o documento'); return; }
          Promise.all([
            sb.from('anexos').insert({ solicitacao_id:id, nome_arquivo:file.name, storage_path:path, tamanho_bytes:file.size, enviado_por:perfil.id }),
            sb.from('historico').insert({ entidade_tipo:'solicitacao', entidade_id:id, texto:'Documento reenviado pelo app.', created_by:perfil.id })
          ]).then(function(){
            showToast('Documento enviado — aguardando conferência do pós-vendas');
            closeSheet();
            refreshData().then(renderContent);
          });
        });
      });
    }
  }

  function addHistorico(tipo, id, texto, visivelExterno){
    var payload = { entidade_tipo: tipo, entidade_id: id, texto: texto, created_by: perfil.id };
    if(visivelExterno===false) payload.visivel_externo = false;
    return sb.from('historico').insert(payload);
  }

  function bindSheetActions(){
    document.querySelectorAll('[data-action]').forEach(function(btn){
      btn.addEventListener('click', function(){
        btn.disabled = true;
        var action = btn.dataset.action, id = btn.dataset.id, to = btn.dataset.to;
        var work;
        if(action==='lead-advance' && to==='fechado'){
          work = sb.rpc('fechar_lead', { p_lead_id: id }).then(function(res){
            if(res.error) throw res.error;
            showToast(res.data ? 'Lead fechado — implantação aberta automaticamente' : 'Lead fechado');
          });
        } else if(action==='lead-advance'){
          work = sb.from('leads').update({etapa:to, updated_at:new Date().toISOString()}).eq('id', id)
            .then(function(){ return addHistorico('lead', id, 'Movido para "'+LEAD_STAGES.find(function(s){return s.key===to;}).label+'".'); })
            .then(function(){ showToast('Lead atualizado'); });
        } else if(action==='task-advance'){
          work = sb.from('tarefas_admin').update({etapa:to}).eq('id', id).then(function(){ showToast('Tarefa atualizada'); });
        } else if(action==='incl-advance'){
          work = sb.from('inclusao_propostas').update({etapa:to}).eq('id', id)
            .then(function(){ return addHistorico('inclusao', id, 'Movido para "'+INCL_STAGES.find(function(s){return s.key===to;}).label+'".'); })
            .then(function(){ showToast('Proposta atualizada'); });
        } else if(action==='fin-advance'){
          work = sb.from('financeiro').update({etapa:to}).eq('id', id)
            .then(function(){ return addHistorico('financeiro', id, 'Movido para "'+FIN_STAGES.find(function(s){return s.key===to;}).label+'".'); })
            .then(function(){ showToast('Financeiro atualizado'); });
        } else if(action==='pv-advance'){
          work = sb.from('solicitacoes').update({etapa_interna:to, updated_at:new Date().toISOString()}).eq('id', id)
            .then(function(){ return addHistorico('solicitacao', id, 'Movido para "'+PV_STAGES.find(function(s){return s.key===to;}).label+'".'); })
            .then(function(){ showToast('Solicitação atualizada'); });
        } else if(action==='pv-claim'){
          work = sb.from('solicitacoes').update({responsavel_id: perfil.id}).eq('id', id)
            .then(function(){ return addHistorico('solicitacao', id, perfil.nome+' assumiu este atendimento.'); })
            .then(function(){ showToast('Atendimento assumido'); });
        } else if(action==='pv-set-pend'){
          work = sb.from('solicitacoes').update({pendencia_doc:true, pendencia_descricao:'Documento adicional solicitado pelo pós-vendas.'}).eq('id', id)
            .then(function(){ showToast('Pendência registrada — cliente já vê no app dele'); });
        } else if(action==='pv-clear-pend'){
          work = sb.from('solicitacoes').update({pendencia_doc:false, pendencia_descricao:null}).eq('id', id)
            .then(function(){ return addHistorico('solicitacao', id, 'Pendência de documento resolvida.'); })
            .then(function(){ showToast('Pendência resolvida'); });
        } else if(action==='comissao-cancelar'){
          work = sb.from('comissao_acompanhamentos').update({status:'cancelado', updated_at:new Date().toISOString()}).eq('id', id)
            .then(function(){ return addHistorico('comissao', id, 'Marcado como cancelado — parou de ser acompanhado.'); })
            .then(function(){ showToast('Marcado como cancelado'); });
        } else if(action==='comissao-reativar'){
          work = sb.from('comissao_acompanhamentos').update({status:'ok', updated_at:new Date().toISOString()}).eq('id', id)
            .then(function(){ return addHistorico('comissao', id, 'Reativado — voltando a ser acompanhado.'); })
            .then(function(){ showToast('Reativado'); });
        } else {
          work = Promise.resolve();
        }
        work.catch(function(){ showToast('Não deu certo — tente de novo'); }).then(function(){
          closeSheet();
          return refreshData();
        }).then(function(){
          renderAppBar(); renderBottomTabbar(); renderContent();
        });
      });
    });
    document.querySelectorAll('[data-download]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var path = btn.dataset.download;
        sb.storage.from('documentos').createSignedUrl(path, 300).then(function(res){
          if(res.error || !res.data){ showToast('Não consegui gerar o link — tente de novo'); return; }
          window.open(res.data.signedUrl, '_blank');
        });
      });
    });
  }

  /* ============== INÍCIO ============== */
  boot();
})();
</script>
