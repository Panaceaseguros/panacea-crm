<title>Panacea CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#F7F5EC; --surface:#FFFFFF; --surface-2:#F0EDE1; --border:#E3DFCF;
    --ink:#152420; --ink-muted:#5D6E67; --ink-faint:#8B978F; --shadow:rgba(15,46,39,.14);
    --teal-900:#0F2E27; --teal-800:#153B32; --teal-700:#1B4A3F; --teal-tint:#E4ECE8;
    --gold:#B9922E; --gold-dark:#8F701E; --gold-light:#E7C765; --gold-tint:#F7EFD9;
    --success:#2E7D5B; --success-tint:#E1F0E8;
    --warning:#C77D22; --warning-tint:#FBEBD6;
    --critical:#B23B3B; --critical-tint:#F8E4E1;
    --info:#3B6FB2; --info-tint:#E4ECF6;
    --radius-lg:22px; --radius-md:14px; --radius-sm:9px;
    --font-display:'Sora',ui-sans-serif,system-ui,sans-serif;
    --font-body:'Karla',ui-sans-serif,system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  svg{width:1em; height:1em; flex:none; vertical-align:-0.125em;}
  body{font-family:var(--font-body); -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; background:var(--teal-900);}
  h1,h2,h3,.disp{font-family:var(--font-display); text-wrap:balance; letter-spacing:-.01em;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:#F7EFD9; color:#0F2E27;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  /* app fills the real viewport — always the brand/light theme, same design
     the approved prototype locked the phone-mock screen to */
  .app-shell{
    position:fixed; inset:0; background:#fff;
    --bg:#F7F5EC; --surface:#FFFFFF; --surface-2:#F0EDE1; --border:#E3DFCF;
    --ink:#152420; --ink-muted:#5D6E67; --ink-faint:#8B978F; --shadow:rgba(15,46,39,.14);
    --teal-tint:#E4ECE8; --gold-tint:#F7EFD9;
    --success-tint:#E1F0E8; --warning-tint:#FBEBD6; --critical-tint:#F8E4E1; --info-tint:#E4ECF6;
    display:flex; flex-direction:column; font-size:15.5px; color:#16231F; overflow:hidden;
  }
  .app-bar{
    background:linear-gradient(155deg, var(--teal-900), var(--teal-800));
    color:#fff; padding:max(20px,env(safe-area-inset-top)) 16px 14px; flex:none; position:relative;
  }
  .app-bar .row1{display:flex; align-items:center; justify-content:space-between; gap:.5rem;}
  .app-bar .who{display:flex; align-items:center; gap:.5rem; min-width:0;}
  .app-bar .glyph{color:var(--gold-light); font-size:1.15rem; flex:none;}
  .app-bar .role-name{font-family:var(--font-display); font-weight:700; font-size:1.02rem;}
  .app-bar .sub{font-size:.72rem; color:#BFD2CB; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-actions{display:flex; gap:.4rem; flex:none;}
  .bell-btn,.logout-btn{position:relative; background:rgba(255,255,255,.12); border:none; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; cursor:pointer;}
  .bell-btn svg,.logout-btn svg{width:16px; height:16px;}
  .bell-dot{position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--gold-light); border:1.5px solid var(--teal-900);}
  .tabs-strip{display:flex; gap:.4rem; margin-top:14px; overflow-x:auto; scrollbar-width:none;}
  .tabs-strip::-webkit-scrollbar{display:none;}
  .tabs-strip button{
    flex:none; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#EAF1EE;
    font-size:.74rem; font-weight:600; padding:.4rem .75rem; border-radius:999px; cursor:pointer;
  }
  .tabs-strip button[aria-selected="true"]{background:var(--gold); border-color:var(--gold); color:#1B1608;}

  .content{flex:1; overflow-y:auto; background:var(--bg); position:relative;}
  .content-pad{padding:16px 16px 34px;}

  .kanban{display:flex; gap:12px; overflow-x:auto; padding:14px 14px 14px; scroll-snap-type:x proximity; height:100%;}
  .kanban::-webkit-scrollbar{height:5px;}
  .column{flex:none; width:270px; scroll-snap-align:start; display:flex; flex-direction:column; max-height:100%;}
  .column-head{display:flex; align-items:center; justify-content:space-between; padding:0 2px 8px;}
  .column-head .name{font-family:var(--font-display); font-weight:700; font-size:.82rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-muted);}
  .column-count{font-family:var(--font-mono); font-size:.72rem; background:var(--surface-2); color:var(--ink-muted); border-radius:999px; padding:.05rem .45rem;}
  .column-body{display:flex; flex-direction:column; gap:9px; overflow-y:auto; padding-bottom:8px; flex:1;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:.75rem .8rem; text-align:left; cursor:pointer; box-shadow:0 1px 2px var(--shadow);
    display:flex; flex-direction:column; gap:.4rem; width:100%;
  }
  .card:hover{border-color:var(--gold);}
  .card .name{font-weight:700; font-size:.9rem; line-height:1.25;}
  .card .meta{color:var(--ink-muted); font-size:.78rem;}
  .card .foot{display:flex; align-items:center; justify-content:space-between; margin-top:.15rem; flex-wrap:wrap; gap:.3rem;}
  .card .money{font-family:var(--font-mono); font-weight:600; font-size:.82rem; color:var(--teal-900);}

  .chip{display:inline-flex; align-items:center; gap:.3rem; font-size:.68rem; font-weight:700; padding:.2rem .5rem; border-radius:999px; white-space:nowrap;}
  .chip svg{width:10px; height:10px;}
  .chip-ok{background:var(--success-tint); color:var(--success);}
  .chip-warn{background:var(--warning-tint); color:var(--warning);}
  .chip-crit{background:var(--critical-tint); color:var(--critical);}
  .chip-info{background:var(--info-tint); color:var(--info);}
  .chip-gold{background:var(--gold-tint); color:var(--gold-dark);}
  .chip-neutral{background:var(--surface-2); color:var(--ink-muted);}

  .empty-col{border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:1rem .7rem; color:var(--ink-faint); font-size:.78rem; text-align:center;}

  .list{display:flex; flex-direction:column; gap:10px;}
  .row-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:.8rem .85rem; cursor:pointer; box-shadow:0 1px 2px var(--shadow);}
  .row-card:hover{border-color:var(--gold);}
  .row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:.5rem;}
  .row-title{font-weight:700; font-size:.9rem;}
  .row-title svg{width:13px; height:13px; margin-right:1px;}
  .row-sub{color:var(--ink-muted); font-size:.78rem; margin-top:2px;}
  .pending-banner{
    display:flex; gap:.5rem; align-items:flex-start; background:var(--critical-tint); color:var(--critical);
    border-radius:var(--radius-sm); padding:.5rem .6rem; font-size:.76rem; margin-top:.5rem; font-weight:600;
  }
  .pending-banner svg{width:14px; height:14px; flex:none; margin-top:1px;}

  .section-label{font-family:var(--font-display); font-weight:700; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); margin:0 0 .6rem;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:1.1rem;}
  .stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:.75rem .8rem;}
  .stat-tile .n{font-family:var(--font-mono); font-weight:600; font-size:1.35rem; color:var(--teal-900);}
  .stat-tile .l{font-size:.72rem; color:var(--ink-muted); margin-top:1px;}
  .bar-row{display:grid; grid-template-columns:84px 1fr auto; align-items:center; gap:.55rem; margin-bottom:.6rem;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-label{font-size:.72rem; color:var(--ink-muted); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{position:relative; height:10px; background:var(--surface-2); border-radius:6px; overflow:hidden;}
  .bar-fill-prev{position:absolute; top:0; left:0; height:100%; background:var(--warning-tint); border-radius:6px;}
  .bar-fill-rec{position:absolute; top:0; left:0; height:100%; background:var(--teal-900); border-radius:6px;}
  .bar-vals{font-size:.68rem; color:var(--ink-muted); white-space:nowrap;}
  .bar-legend{display:flex; gap:.9rem; font-size:.68rem; color:var(--ink-muted); margin-bottom:.7rem;}
  .bar-legend .sw{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:-1px;}
  .recibo-doc{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:.9rem; margin-bottom:1rem;}
  .recibo-doc-head{display:flex; justify-content:space-between; font-weight:700; font-size:.85rem; background:var(--surface-2); padding:.5rem .6rem; border-radius:8px; margin-bottom:.6rem;}
  .recibo-doc-sub{font-size:.8rem; margin-bottom:.7rem;}
  .recibo-semana{margin-bottom:.5rem;}
  .recibo-semana-head{font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-muted); background:var(--surface-2); padding:.35rem .5rem; border-radius:6px 6px 0 0;}
  .recibo-linha{display:flex; justify-content:space-between; align-items:center; gap:.5rem; padding:.35rem .5rem; font-size:.78rem; border-bottom:1px solid var(--border);}
  .recibo-linha span:first-child{flex:1;}
  .recibo-subtotal{background:var(--surface-2); font-weight:700;}
  .recibo-total{background:var(--teal-900); color:#fff; font-weight:700; border-radius:8px; margin-top:.5rem; padding:.6rem .65rem; border-bottom:none;}
  .recibo-linha-del{border:none; background:none; color:var(--critical); font-size:1.05rem; line-height:1; cursor:pointer; padding:0 .2rem; flex:none;}
  .recibo-doc-foot{margin-top:.9rem; padding-top:.7rem; border-top:1px dashed var(--border); font-size:.8rem;}
  .recibo-assinatura{display:flex; align-items:center; gap:.4rem; font-size:.78rem; color:var(--ink-muted); margin-top:.6rem;}
  .recibo-assinatura.ok{color:var(--success);}
  .dept-btn{width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:.8rem .85rem; cursor:pointer; display:flex; align-items:center; gap:.6rem; margin-bottom:9px;}
  .dept-btn:hover{border-color:var(--gold);}
  .dept-btn .ic{width:34px; height:34px; border-radius:10px; background:var(--teal-tint); color:var(--teal-900); display:grid; place-items:center; flex:none;}
  .dept-btn .ic svg{width:16px; height:16px;}
  .dept-btn .tt{font-weight:700; font-size:.86rem;}
  .dept-btn .ss{font-size:.75rem; color:var(--ink-muted);}
  .dept-btn .arrow{margin-left:auto; color:var(--ink-faint); width:14px; height:14px;}
  .dept-btn .arrow svg{width:14px; height:14px;}

  .switcher{padding:12px 14px 2px; display:flex; flex-direction:column; gap:6px;}
  .switch-label{font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);}
  .switch-row{display:flex; flex-wrap:wrap; gap:.35rem;}
  .switch-row button{border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:.72rem; font-weight:700; padding:.32rem .65rem; border-radius:999px; cursor:pointer; white-space:nowrap;}
  .switch-row button[aria-pressed="true"]{background:var(--teal-900); border-color:var(--teal-900); color:#fff;}

  .alert-item{display:flex; gap:.55rem; align-items:flex-start; padding:.65rem 0; border-bottom:1px solid var(--border);}
  .alert-item:last-child{border-bottom:none;}
  .alert-ic{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex:none;}
  .alert-ic svg{width:13px; height:13px;}
  .alert-tx{font-size:.8rem; line-height:1.35;}
  .alert-tx b{font-weight:700;}

  .field{margin-bottom:.85rem; display:flex; flex-direction:column; gap:.3rem;}
  .field label{font-size:.74rem; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em;}
  .field select, .field textarea, .field input{
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:.55rem .65rem; font-family:inherit; font-size:.87rem;
    background:var(--surface); color:var(--ink); resize:vertical;
  }
  .field select:focus, .field textarea:focus, .field input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .attach-mock{display:flex; align-items:center; gap:.5rem; border:1.5px dashed var(--border); border-radius:var(--radius-sm); padding:.55rem .65rem; cursor:pointer; font-size:.82rem; color:var(--ink-muted); background:transparent;}
  .attach-mock:hover{border-color:var(--gold); color:var(--gold-dark);}
  .attach-mock svg{width:15px; height:15px;}
  .attach-chip{display:inline-flex; align-items:center; gap:.35rem; background:var(--gold-tint); color:var(--gold-dark); font-size:.76rem; font-weight:600; padding:.3rem .55rem; border-radius:999px; margin-top:.4rem;}
  .btn{
    font-family:var(--font-display); font-weight:700; font-size:.84rem; border:none; border-radius:999px;
    padding:.65rem 1.1rem; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:.4rem; width:100%;
  }
  .btn svg{width:14px; height:14px;}
  .btn:disabled{opacity:.6; cursor:default;}
  .btn-primary{background:var(--teal-900); color:#fff;}
  .btn-primary:hover{background:var(--teal-800);}
  .btn-gold{background:var(--gold); color:#251D08;}
  .btn-gold:hover{background:var(--gold-dark); color:#fff;}
  .btn-ghost{background:var(--surface-2); color:var(--ink);}
  .btn-danger{background:var(--critical-tint); color:var(--critical);}
  .btn-row{display:flex; flex-direction:column; gap:.55rem; margin-top:1rem;}

  .tabbar{flex:none; display:flex; overflow-x:auto; border-top:1px solid var(--border); background:var(--surface); padding-bottom:env(safe-area-inset-bottom);}
  .tabbar button{flex:1 1 0; background:none; border:none; padding:.55rem .35rem .7rem; display:flex; flex-direction:column; align-items:center; gap:.2rem; cursor:pointer; color:var(--ink-faint); white-space:nowrap;}
  .tabbar button svg{width:19px; height:19px;}
  .tabbar button span{font-size:.62rem; font-weight:700;}
  .tabbar button[aria-selected="true"]{color:var(--teal-900);}
  .tabbar button[aria-selected="true"] svg{color:var(--gold-dark);}

  .sheet-backdrop{position:fixed; inset:0; background:rgba(10,20,17,.42); z-index:20; opacity:0; pointer-events:none; transition:opacity .18s;}
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; max-height:86%; background:var(--surface);
    border-radius:22px 22px 0 0; z-index:21; padding:1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom)); box-shadow:0 -10px 30px var(--shadow);
    transform:translateY(100%); transition:transform .22s ease; display:flex; flex-direction:column;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:99px; margin:0 auto .7rem;}
  .sheet-scroll{overflow-y:auto; flex:1;}
  .sheet h3{margin:0 0 .2rem; font-size:1.02rem;}
  .sheet .close-x{position:absolute; top:.8rem; right:.9rem; background:var(--surface-2); border:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; cursor:pointer; color:var(--ink-muted);}
  .sheet .close-x svg{width:13px; height:13px;}
  .kv{display:flex; justify-content:space-between; gap:1rem; padding:.4rem 0; border-bottom:1px solid var(--border); font-size:.82rem;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--ink-muted);}
  .kv svg{width:12px; height:12px; margin-right:1px;}
  .kv .v{font-weight:600; text-align:right;}
  .timeline{display:flex; flex-direction:column; gap:.6rem; margin-top:.3rem;}
  .tl-item{display:flex; gap:.55rem;}
  .tl-dot{width:7px; height:7px; border-radius:50%; background:var(--gold); margin-top:.4rem; flex:none;}
  .tl-tx{font-size:.8rem;}
  .tl-tx .d{color:var(--ink-faint); font-size:.7rem;}

  .toast{
    position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom)); transform:translate(-50%,10px); background:var(--teal-900); color:#fff;
    padding:.55rem .95rem; border-radius:999px; font-size:.8rem; font-weight:600; box-shadow:0 8px 20px var(--shadow);
    z-index:30; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; display:flex; align-items:center; gap:.4rem; max-width:88vw;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}
  .toast svg{width:14px; height:14px; color:var(--gold-light); flex:none;}

  /* auth screens */
  .auth-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1.3rem; background:linear-gradient(155deg, var(--teal-900), var(--teal-800)); min-height:100%; overflow-y:auto;}
  .auth-card{width:100%; max-width:360px; background:var(--surface); border-radius:var(--radius-lg); padding:1.8rem 1.6rem; box-shadow:0 20px 50px rgba(0,0,0,.28);}
  .auth-brand{display:flex; flex-direction:column; align-items:center; gap:.3rem; margin-bottom:1.3rem; text-align:center;}
  .auth-brand .glyph{font-size:1.7rem; color:var(--gold);}
  .auth-brand .word{font-family:var(--font-display); font-weight:800; font-size:1.1rem; letter-spacing:.04em; text-transform:uppercase; color:var(--teal-900);}
  .auth-brand .word small{display:block; font-family:'Karla'; font-weight:400; font-style:italic; text-transform:none; letter-spacing:0; font-size:.74rem; color:var(--ink-muted); margin-top:-2px;}
  .auth-title{font-family:var(--font-display); font-weight:700; font-size:1.04rem; text-align:center; margin-bottom:.2rem;}
  .auth-sub{color:var(--ink-muted); font-size:.83rem; text-align:center; margin-bottom:1.2rem;}
  .auth-error{background:var(--critical-tint); color:var(--critical); font-size:.82rem; font-weight:600; padding:.6rem .7rem; border-radius:var(--radius-sm); margin-bottom:.9rem; display:flex; gap:.4rem; align-items:flex-start;}
  .auth-error svg{width:14px;height:14px;flex:none;margin-top:1px;}
  .auth-note{background:var(--success-tint); color:var(--success); font-size:.82rem; font-weight:600; padding:.6rem .7rem; border-radius:var(--radius-sm); margin-bottom:.9rem;}
  .auth-switch{text-align:center; font-size:.82rem; color:var(--ink-muted); margin-top:1.1rem;}
  .auth-switch button{background:none;border:none;color:var(--gold-dark);font-weight:700;cursor:pointer;padding:0;font-size:inherit;}
  .pending-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1.4rem; text-align:center; gap:.8rem; background:var(--bg);}
  .pending-wrap .ic-big{width:52px;height:52px;border-radius:50%;background:var(--gold-tint);color:var(--gold-dark);display:grid;place-items:center;}
  .pending-wrap .ic-big svg{width:24px;height:24px;}
  .pending-wrap h2{font-size:1.1rem;margin:0;}
  .pending-wrap p{color:var(--ink-muted);font-size:.88rem;max-width:32ch;margin:0;}
  .loading-wrap{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:.86rem;background:var(--bg);}
</style>

<div class="app-shell" id="appShell"></div>

  function daysSince(dateStr){
    if(!dateStr) return 0;
    var d = new Date(dateStr);
    if(isNaN(d.getTime())) return 0;
    return Math.max(0, Math.floor((Date.now() - d.getTime())/86400000));
  }
  function daysUntil(dateStr){
    if(!dateStr) return 0;

    if(isNaN(d.getTime())) return 0;
    return Math.max(0, Math.ceil((d.getTime() - Date.now())/86400000));
  }
  // Dias corridos entre duas datas/timestamps (usado pro tempo médio de
  // atendimento do pós-vendas). Retorna null se alguma data for inválida.
  function diasEntreDatas(a, b){
    if(!a || !b) return null;
    var da = new Date(a), db = new Date(b);
    if(isNaN(da.getTime()) || isNaN(db.getTime())) return null;
    return Math.max(0, Math.round((db.getTime()-da.getTime())/86400000));
  }
  // Próxima data de aniversário de um contrato (dia/mês), projetando pro
  // próximo ano se a data deste ano já passou.
  function proximoAniversario(dia, mes){
    var hoje = new Date(); hoje.setHours(0,0,0,0);
    var ano = hoje.getFullYear();
    var cand = new Date(ano, mes-1, Math.min(dia, 28));
    // ajuste pra meses com menos dias (evita "rolar" pro mês seguinte)
    var ultimoDiaMes = new Date(ano, mes, 0).getDate();
    cand = new Date(ano, mes-1, Math.min(dia, ultimoDiaMes));
    if(cand < hoje){
      ultimoDiaMes = new Date(ano+1, mes, 0).getDate();
      cand = new Date(ano+1, mes-1, Math.min(dia, ultimoDiaMes));
    }
    return cand;
  }
  function diasAteAniversario(dia, mes){
    var cand = proximoAniversario(dia, mes);
    var hoje = new Date(); hoje.setHours(0,0,0,0);
    return Math.round((cand.getTime()-hoje.getTime())/86400000);
  }
  function computeAtrasada(dateStr, etapa, finalKeys){
    if(!dateStr) return false;
    var finals = Array.isArray(finalKeys) ? finalKeys : [finalKeys];
    if(finals.indexOf(etapa)!==-1) return false;
    var d = new Date(dateStr);
    if(isNaN(d.getTime())) return false;
    var today = new Date(); today.setHours(0,0,0,0);
    return d < today;
  }

  function traduzErroAuth(error){
    var m = (error && error.message) || '';
    if(/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
    if(/already registered|already exists|User already registered/i.test(m)) return 'Já existe uma conta com esse e-mail — tente entrar.';
    if(/password should be|at least 6/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
    if(/rate limit/i.test(m)) return 'Muitas tentativas — espere um instante e tente de novo.';
    if(/email/i.test(m) && /invalid/i.test(m)) return 'Esse e-mail não parece válido.';
    return 'Não deu certo agora — confira os dados e tente novamente.';
  }

  function handleLogin(e){
    e.preventDefault();
    authMsg();
    var form = e.target;
    var email = form.email.value.trim();
    var password = form.password.value;
    var btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    sb.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      btn.disabled = false;
      if(res.error){ authMsg('error', traduzErroAuth(res.error)); return; }
      session = res.data.session;
      loadPerfilAndStart();
    });
  }

  function handleSignup(e){
    e.preventDefault();
    authMsg();
    var form = e.target;
    var email = form.email.value.trim();
    var password = form.password.value;
    var btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    sb.auth.signUp({ email: email, password: password }).then(function(res){
      btn.disabled = false;
      if(res.error){ authMsg('error', traduzErroAuth(res.error)); return; }
      if(res.data.session){ session = res.data.session; loadPerfilAndStart(); }
      else { authMsg('ok', 'Conta criada! Se pedirmos confirmação por e-mail, confirme e depois volte aqui pra entrar.'); }
    });
  }

  function loadPerfilAndStart(){
    document.getElementById('appShell').innerHTML = loadingHtml('Carregando sua conta...');

      var user = res.data && res.data.user;
      if(!user){ renderLogin(); return; }
      sb.from('perfis').select('*, empresas(nome)').eq('id', user.id).maybeSingle().then(function(pres){
        if(pres.error || !pres.data){ renderPending(user.email); return; }
        var row = pres.data;
        perfil = { id:row.id, papel:row.papel, nome:row.nome, email:user.email, empresaId:row.empresa_id, empresaNome: row.empresas ? row.empresas.nome : null };

        document.getElementById('appShell').innerHTML = appFrameHtml();
        bindShellHandlers();
        renderAppBar(); renderBottomTabbar();
        document.getElementById('contentArea').innerHTML = loadingHtml('Carregando dados...');
        refreshData().then(renderContent);
      });
    });
  }

        (alerts.length ? alerts.map(alertRow).join('') : '<div class="empty-col">Tudo em dia por aqui.</div>');

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById('toast');
    if(!t) return;
    t.innerHTML = ic('check') + '<span>'+msg+'</span>';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  function openSheet(html){
    document.getElementById('sheetBody').innerHTML = html;
    document.getElementById('sheet').classList.add('open');
    document.getElementById('sheetBackdrop').classList.add('open');
  }
  function closeSheet(){
    var sheet = document.getElementById('sheet');
    var bd = document.getElementById('sheetBackdrop');
    if(sheet) sheet.classList.remove('open');
    if(bd) bd.classList.remove('open');

  function alertRow(a){
    return '<div class="alert-item"><div class="alert-ic" style="background:'+toneBg(a.tone)+';color:'+toneFg(a.tone)+'">'+ic(a.icon)+'</div><div class="alert-tx">'+a.text+'</div></div>';
  }

  function computeAlerts(){
    var out = [];
    STATE.leads.forEach(function(l){
      if(['fechado','perdido'].indexOf(l.etapa)===-1 && l.dias>=5){
        out.push({icon:'clock', tone:'warn', text:'Lead <b>'+l.nome+'</b> parado há '+l.dias+' dias em "'+LEAD_STAGES.find(function(s){return s.key===l.etapa;}).label+'".'});
      }
    });
    STATE.tasks.forEach(function(t){
      if(t.atrasada) out.push({icon:'alert', tone:'crit', text:'Tarefa <b>'+t.titulo+'</b> está atrasada (prazo '+t.prazo+').'});
    });
    STATE.inclusaoPropostas.forEach(function(t){
      if(t.atrasada) out.push({icon:'alert', tone:'crit', text:'Implantação de <b>'+t.empresa+'</b> atrasada (prazo '+t.prazo+').'});
    });
    STATE.financeiro.forEach(function(t){
      if(t.etapa==='inadimplente') out.push({icon:'alert', tone:'crit', text:'<b>'+t.empresa+'</b> está inadimplente — venceu em '+t.vencimento+'.'});
    });
    STATE.posvendas.forEach(function(p){
      (p.anexos||[]).forEach(function(a){
        if(a.expira<=3) out.push({icon:'doc', tone:'warn', text:'Anexo <b>'+a.nome+'</b> ('+p.empresaOuCliente+') expira em '+a.expira+' dia(s).'});
      });
      if(p.pendenciaDoc) out.push({icon:'alert', tone:'crit', text:'Pendência aberta com <b>'+p.empresaOuCliente+'</b>: '+p.pendenciaDescricao});
      if(p.atrasada) out.push({icon:'alert', tone:'crit', text:'Solicitação de <b>'+p.empresaOuCliente+'</b> ('+p.tipo+') está atrasada (prazo '+p.prazo+').'});
    });
    STATE.contratos.forEach(function(c){
      var dias = diasAteAniversario(c.diaAniversario, c.mesAniversario);
      if(dias<=30) out.push({icon:'clock', tone:(dias<=7?'crit':'warn'), text:'Reajuste de <b>'+c.empresaNome+'</b> ('+c.operadora+') em '+dias+' dia(s) — aniversário do contrato.'});
    });
    STATE.segurados.forEach(function(s){
      if(s.situacao==='inadimplente') out.push({icon:'alert', tone:'crit', text:'<b>'+s.nome+'</b> ('+s.empresaNome+') está inadimplente.'});
    });
    STATE.comissoes.forEach(function(c){
      if(c.status==='atrasado') out.push({icon:'alert', tone:'crit', text:'Comissão de <b>'+c.operadora+'</b> ('+c.empresaNome+', '+c.referenciaLabel+') está atrasada.'});
    });
    return out;
  }

  function dynamicSub(){
    if(perfil.papel==='posvendas') return perfil.nome + ' · Time de pós-vendas';
    if(perfil.papel==='rh') return perfil.nome + ' · ' + (perfil.empresaNome||'');
    if(perfil.papel==='cliente') return perfil.nome + ' · Segurado(a)';
    if(perfil.papel==='vendedor') return perfil.nome + ' · Consultor comercial';
    if(perfil.papel==='administrativo') return perfil.nome + ' · Time administrativo';
    if(perfil.papel==='gestao') return perfil.nome + ' · Visão de toda a Panacea';
    if(perfil.papel==='implantacao') return perfil.nome + ' · Pós-vendas e implantação';
    return perfil.nome;

  /* ============== DADOS REAIS (Supabase) ============== */
  function fetchHistoricoFor(tipo, ids){
    if(!ids.length) return Promise.resolve({});
    return sb.from('historico').select('*').eq('entidade_tipo', tipo).in('entidade_id', ids).order('created_at', {ascending:true}).then(function(res){
      var out = {};
      if(res.error) return out;
      (res.data||[]).forEach(function(h){
        if(!out[h.entidade_id]) out[h.entidade_id] = [];
        out[h.entidade_id].push({ d: fmtDateBR(h.created_at), t: h.texto, interno: h.visivel_externo===false });
      });
      return out;
    });
  }

  function fetchAnexosFor(solicitacaoIds){
    if(!solicitacaoIds.length) return Promise.resolve({});
    return sb.from('anexos').select('*').in('solicitacao_id', solicitacaoIds).order('expira_em', {ascending:true}).then(function(res){
      var out = {};
      if(res.error) return out;
      (res.data||[]).forEach(function(a){
        if(!out[a.solicitacao_id]) out[a.solicitacao_id] = [];
        out[a.solicitacao_id].push({ nome:a.nome_arquivo, expira: daysUntil(a.expira_em), path:a.storage_path });
      });
      return out;
    });
  }

  function fetchLeads(){
    return sb.from('leads').select('*, perfis(nome)').order('created_at', {ascending:false}).then(function(res){
      if(res.error){ showToast('Erro ao carregar leads'); STATE.leads=[]; return; }
      var rows = res.data||[];
      return fetchHistoricoFor('lead', rows.map(function(r){return r.id;})).then(function(hist){
        STATE.leads = rows.map(function(r){
          return {
            id:r.id, nome:r.nome_contato, empresa:r.empresa_prospect||'—', tipo:r.tipo_negocio||'—',
            valor:Number(r.valor_estimado)||0, etapa:r.etapa, dias: daysSince(r.updated_at||r.created_at),
            vendedor: (r.perfis && r.perfis.nome) || '—', historico: hist[r.id]||[]
          };
        });
      });
    });
  }

  function fetchPosvendas(internal){
    var query = internal
      ? sb.from('solicitacoes').select('*, empresas(nome), solicitante:perfis!solicitacoes_solicitante_id_fkey(nome), responsavel:perfis!solicitacoes_responsavel_id_fkey(nome)').order('data_abertura', {ascending:false})
      : sb.from('solicitacoes_status_simplificado').select('*').order('data_abertura', {ascending:false});
    return query.then(function(res){
      if(res.error){ showToast('Erro ao carregar solicitações'); STATE.posvendas=[]; return; }
      var rows;
      if(internal){
        rows = (res.data||[]).map(function(r){
          return {
            id:r.id, tipo:r.tipo, origemTipo:r.origem_tipo,
            empresaOuCliente: (r.empresas && r.empresas.nome) || (r.solicitante && r.solicitante.nome) || '—',
            solicitante: (r.solicitante && r.solicitante.nome) || '—',
            responsavel: (r.responsavel && r.responsavel.nome) || '',
            etapaInterna: r.etapa_interna, dataAbertura: fmtDateBR(r.data_abertura),
            pendenciaDoc: r.pendencia_doc, pendenciaDescricao: r.pendencia_descricao||'',
            prazo: r.prazo ? fmtDateBR(r.prazo) : '', prazoISO: r.prazo || '',
            atrasada: computeAtrasada(r.prazo, r.etapa_interna, 'concluido'),
            dataAberturaISO: r.data_abertura, updatedAtISO: r.updated_at,
            anexos: [], historico: [], _responsavelId: r.responsavel_id
          };
        });
      } else {
        rows = (res.data||[]).map(function(r){
          return {
            id:r.id, tipo:r.tipo, origemTipo:r.origem_tipo,
            empresaOuCliente: r.empresa_nome || perfil.nome,
            solicitante: r.solicitante_nome || perfil.nome,
            responsavel:'', etapaInterna: r.status, dataAbertura: fmtDateBR(r.data_abertura),
            pendenciaDoc: r.pendencia_doc, pendenciaDescricao: r.pendencia_descricao||'',
            anexos: [], historico: []
          };
        });
      }
      var ids = rows.map(function(r){return r.id;});
      return Promise.all([ fetchHistoricoFor('solicitacao', ids), fetchAnexosFor(ids) ]).then(function(both){
        var hist = both[0], anx = both[1];

  function refreshData(){
    var p = perfil.papel;
    if(p==='vendedor') return Promise.all([fetchLeads(), fetchRecibosMensais(), fetchRecibosLancamentos(), fetchComissoes()]);
    if(p==='administrativo') return Promise.all([fetchTasks(), fetchInclusao(), fetchFinanceiro(), fetchRecibosMensais(), fetchRecibosLancamentos(), fetchContratos(), fetchSegurados(), fetchComissoes()]);
    if(p==='posvendas') return Promise.all([fetchPosvendas(true), fetchRecibosMensais(), fetchRecibosLancamentos(), fetchEquipeInterna()]);
    if(p==='rh' || p==='cliente') return fetchPosvendas(false);
    if(p==='gestao') return Promise.all([fetchLeads(), fetchTasks(), fetchInclusao(), fetchFinanceiro(), fetchPosvendas(true), fetchRecibosMensais(), fetchRecibosLancamentos(), fetchContratos(), fetchSegurados(), fetchComissoes(), fetchEquipeInterna()]);
    if(p==='implantacao') return Promise.all([fetchLeads(), fetchTasks(), fetchInclusao(), fetchPosvendas(true), fetchRecibosMensais(), fetchRecibosLancamentos(), fetchEquipeInterna()]);
    return Promise.resolve();
  }

  function viewDesempenhoPosvendas(){
    var pvTeam = STATE.equipeInterna.filter(function(m){ return m.papel==='posvendas' || m.papel==='implantacao'; });
    var porPessoa = {};
    pvTeam.forEach(function(m){ porPessoa[m.id] = { nome:m.nome, total:0, concluidos:0, andamento:0, atrasados:0, somaDias:0, qtdDias:0 }; });
    var semResponsavel = 0;
    STATE.posvendas.forEach(function(p){
      if(!p._responsavelId){ semResponsavel++; return; }
      var b = porPessoa[p._responsavelId];
      if(!b) return; // responsável não está mais na equipe ativa
      b.total++;
      if(p.etapaInterna==='concluido'){
        b.concluidos++;
        var dias = diasEntreDatas(p.dataAberturaISO, p.updatedAtISO);
        if(dias!=null){ b.somaDias += dias; b.qtdDias++; }
      } else {
        b.andamento++;
        if(p.atrasada) b.atrasados++;
      }
    });
    var linhas = pvTeam.map(function(m){ return porPessoa[m.id]; }).sort(function(a,b){ return b.total - a.total; });
    var cards = linhas.map(function(b){
      var tempoMedio = b.qtdDias ? Math.round(b.somaDias/b.qtdDias) : null;
      return '<div class="row-card" style="cursor:default; margin-bottom:.6rem">'+
        '<div class="row-top"><div class="row-title">'+ic('user')+' '+b.nome+'</div>'+
        (b.atrasados ? '<span class="chip chip-crit">'+b.atrasados+' atrasada(s)</span>' : '<span class="chip chip-ok">Em dia</span>')+
        '</div>'+
        '<div class="stat-grid" style="margin-top:.5rem; margin-bottom:0">'+
          '<div class="stat-tile"><div class="n">'+b.total+'</div><div class="l">Atendidas no total</div></div>'+
          '<div class="stat-tile"><div class="n">'+b.concluidos+'</div><div class="l">Concluídas</div></div>'+
          '<div class="stat-tile"><div class="n">'+b.andamento+'</div><div class="l">Em andamento</div></div>'+
          '<div class="stat-tile"><div class="n">'+(tempoMedio!=null?tempoMedio+'d':'—')+'</div><div class="l">Tempo médio p/ concluir</div></div>'+
        '</div></div>';
    }).join('');
    return '<div class="content-pad">'+
      '<div class="section-label">Desempenho do pós-vendas</div>'+
      '<p class="row-sub" style="margin-bottom:.7rem">Quantidade de solicitações atendidas, concluídas e tempo médio de resolução por pessoa.</p>'+
      (semResponsavel ? '<div class="row-card" style="cursor:default;margin-bottom:.6rem"><span class="chip chip-warn">'+semResponsavel+' solicitação(ões) sem responsável</span></div>' : '')+
      (cards || '<div class="empty-col">Ninguém no time de pós-vendas ainda.</div>')+
    '</div>';
  }

  var TIPO_LANCAMENTO_LABEL = {
    fixo:'Fixo', minimo_garantido:'Mínimo garantido', comissao:'Comissão', taxa:'Taxa (desconto)',
    adesao:'Adesão', split:'Split de venda', ajuda_custo:'Ajuda de custo', outro:'Outro'
  };

  function toISODate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmtDatePtCurto(iso){ var d=new Date(iso+'T00:00:00'); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0'); }
  function fmtMoneySigned(n){
    var sign = n<0 ? '-' : '';
    return sign+'R$ '+Math.abs(n).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtDateHoraBR(ts){
    if(!ts) return '—';
    var d = new Date(ts);
    if(isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }
  // Semanas segunda-sexta que cobrem o mês inteiro (mesmo recorte usado na
  // planilha) — a primeira pode começar no mês anterior, a última pode
  // terminar no mês seguinte.
  function weeksForMonth(refMesStr){
    var d = new Date(refMesStr+'T00:00:00');
    var year = d.getFullYear(), month = d.getMonth()+1;
    var first = new Date(year, month-1, 1);
    var last = new Date(year, month, 0);
    var cur = new Date(first);
    var dow = cur.getDay();
    cur.setDate(cur.getDate() + (dow===0 ? -6 : 1-dow));
    var weeks = [];
    while(cur <= last){
      var start = new Date(cur);
      var end = new Date(cur); end.setDate(end.getDate()+4);
      weeks.push({ inicio: toISODate(start), fim: toISODate(end) });
      cur.setDate(cur.getDate()+7);
    }
    return weeks;
  }
  function lancamentosDoRecibo(reciboId){
    return STATE.recibosLancamentos.filter(function(l){return l.reciboId===reciboId;});
  }
  function totalRecibo(reciboId){
    return lancamentosDoRecibo(reciboId).reduce(function(s,l){return s+l.valor;},0);
  }

  // Gera o recibo em PDF, no mesmo desenho (faixas cinza, semana a semana,
  // subtotal e total) usado na tela — pra imprimir e arquivar.
  function gerarPdfRecibo(r){
    if(!window.jspdf || !window.jspdf.jsPDF){ showToast('PDF ainda carregando — tenta de novo em 1 segundo'); return; }
    var lancamentos = lancamentosDoRecibo(r.id);
    var weeks = weeksForMonth(r.referenciaMes);
    var total = lancamentos.reduce(function(s,l){return s+l.valor;},0);
    var refDate = new Date(r.referenciaMes+'T00:00:00');
    var ultimoDia = new Date(refDate.getFullYear(), refDate.getMonth()+1, 0);
    var refLabel = r.referenciaMes.slice(0,7).replace('-','.');

    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit:'mm', format:'a4' });
    var pageW = doc.internal.pageSize.getWidth();
    var marginX = 15;
    var contentW = pageW - marginX*2;
    var valorW = 34;
    var descW = contentW - valorW;
    var INK = [21,36,32];
    var GREY_BAR = [166,166,166];
    var GREY_BAND = [217,217,217];

    var y = 16;
    doc.setTextColor.apply(doc, INK);
    doc.setFont('helvetica','normal');
    doc.setFontSize(9.5);
    doc.text(String(ultimoDia.getDate())+'   '+MESES[ultimoDia.getMonth()]+'   '+ultimoDia.getFullYear(), marginX, y);
    y += 5;

    var boxTop = y;
    doc.setFillColor.apply(doc, GREY_BAR);
    doc.rect(marginX, y, contentW, 8, 'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(10.5);
    doc.text('RECIBO Nº '+refLabel, marginX+3, y+5.4);
    doc.text('VALOR', marginX+contentW-20, y+5.4);
    y += 8;

    doc.setFont('helvetica','normal');
    doc.setFontSize(9.5);
    y += 7;
    doc.text('Recebi (emos) de: ', marginX+3, y);
    var larguraLabel = doc.getTextWidth('Recebi (emos) de: ');
    doc.setFont('helvetica','bold');
    doc.text('Corretora de Seguros Panacea', marginX+3+larguraLabel, y);
    y += 5;

    var body = [];
    var rowKinds = [];
    weeks.forEach(function(w){
      var itens = lancamentos.filter(function(l){return l.semanaInicio===w.inicio;});
      var subtotal = itens.reduce(function(s,l){return s+l.valor;},0);
      body.push([{ content:'recebido '+fmtDatePtCurto(w.inicio)+' - '+fmtDatePtCurto(w.fim), colSpan:2, styles:{ fillColor:GREY_BAND, fontStyle:'bold', halign:'center' } }]);
      rowKinds.push('semana');
      itens.forEach(function(l){
        body.push([ l.descricao, fmtMoneySigned(l.valor) ]);
        rowKinds.push('item');
      });
      body.push([
        { content:'SUBTOTAL recebido na semana', styles:{ fillColor:GREY_BAND, fontStyle:'bold' } },
        { content: fmtMoneySigned(subtotal), styles:{ fillColor:GREY_BAND, fontStyle:'bold', halign:'right' } }
      ]);
      rowKinds.push('subtotal');
    });
    body.push([
      { content:'TOTAL', styles:{ fontStyle:'bold', fontSize:10 } },
      { content: fmtMoney(total), styles:{ fontStyle:'bold', fontSize:10, halign:'right' } }
    ]);
    rowKinds.push('total');

    doc.autoTable({
      startY: y,
      margin: { left: marginX, right: marginX },
      tableWidth: contentW,
      theme: 'plain',
      styles: { font:'helvetica', fontSize:9, textColor:INK, cellPadding:{top:1.6,bottom:1.6,left:3,right:3}, lineColor:[210,210,210], lineWidth:0.15, overflow:'linebreak' },
      columnStyles: { 0:{ cellWidth:descW }, 1:{ cellWidth:valorW, halign:'right' } },
      body: body,
      didParseCell: function(data){
        if(rowKinds[data.row.index]==='total' && data.column.index===1){
          data.cell.styles.lineWidth = 0.4;
          data.cell.styles.lineColor = INK;
        }
      }
    });

    y = doc.lastAutoTable.finalY + 6;
    doc.setFontSize(8.5);
    doc.setFont('helvetica','italic');
    doc.text('e para clareza firmo (amos) a presente.', marginX+3, y);
    y += 5.5;
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.text('São Paulo , '+ultimoDia.getDate()+' de '+MESES[ultimoDia.getMonth()]+' de '+ultimoDia.getFullYear(), marginX+3, y);
    y += 6;
    doc.text('Nome: ', marginX+3, y);
    var lnome = doc.getTextWidth('Nome: ');
    doc.setFont('helvetica','bold');
    doc.text(r.colaboradorNome, marginX+3+lnome, y);
    doc.setFont('helvetica','normal');
    doc.text('CNPJ: —', marginX+contentW-28, y);
    y += 6;
    doc.setFontSize(8.3);
    var legal = doc.splitTextToSize('Prestação de serviços como promoção de vendas, contatos comerciais, entre outras atividades. 1x ao mês emitir Nota para a PANACEA dos valores recebidos totais.', contentW-6);
    doc.text(legal, marginX+3, y);
    y += legal.length*4 + 8;

    if(r.status==='confirmado'){
      doc.setFont('helvetica','bold');
      doc.setFontSize(9);
      doc.text('Confirmado digitalmente por '+r.colaboradorNome+' em '+r.confirmadoEm, marginX+3, y);
      y += 6;
    } else {
      doc.setDrawColor(150,150,150);
      doc.setLineWidth(0.2);
      doc.line(marginX+contentW-70, y, marginX+contentW-3, y);
      y += 4.5;
      doc.setFont('helvetica','bold');
      doc.setFontSize(8.5);
      var lblAss = 'ASSINATURA';
      doc.text(lblAss, marginX+contentW-70 + (67 - doc.getTextWidth(lblAss))/2, y);
      y += 4;
    }

    var boxBottom = y + 3;
    doc.setDrawColor(20,20,20);
    doc.setLineWidth(0.5);
    doc.rect(marginX, boxTop, contentW, boxBottom-boxTop);

    var nomeArquivo = 'Recibo_'+r.colaboradorNome.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_')+'_'+refLabel.replace('.','-')+'.pdf';
    doc.save(nomeArquivo);
  }

  function barChartHtml(items){
    // items: [{label, previsto, recebido}]
    if(!items.length) return '<div class="empty-col">Nada lançado ainda.</div>';
    var maxValor = Math.max(1, items.reduce(function(m,it){return Math.max(m, it.previsto, it.recebido);},0));
    return '<div class="bar-legend"><span><span class="sw" style="background:var(--teal-900)"></span>Recebido</span><span><span class="sw" style="background:var(--warning-tint)"></span>Previsto</span></div>'+
      items.map(function(it){
        var pctPrevisto = Math.round((it.previsto/maxValor)*100);
        var pctRecebido = Math.round((it.recebido/maxValor)*100);
        return '<div class="bar-row"><div class="bar-label" title="'+it.label+'">'+it.label+'</div>'+
          '<div class="bar-track"><div class="bar-fill-prev" style="width:'+pctPrevisto+'%"></div><div class="bar-fill-rec" style="width:'+pctRecebido+'%"></div></div>'+
          '<div class="bar-vals mono">'+fmtMoney(it.recebido)+'</div></div>';
      }).join('');
  }

  function viewPainelComissoes(){
    var porOperadora = {};
    STATE.comissoes.forEach(function(c){
      if(!porOperadora[c.operadora]) porOperadora[c.operadora] = {previsto:0, recebido:0};
      porOperadora[c.operadora].previsto += c.valorPrevisto;
      porOperadora[c.operadora].recebido += c.valorRecebido;
    });
    var itens = Object.keys(porOperadora).sort(function(a,b){ return porOperadora[b].previsto - porOperadora[a].previsto; })
      .map(function(o){ return {label:o, previsto:porOperadora[o].previsto, recebido:porOperadora[o].recebido}; });

    var rows = STATE.comissoes.slice(0, 40);
    var listHtml = rows.length ? rows.map(function(c){
      var statusChip = c.status==='recebido'
        ? '<span class="chip chip-ok">'+ic('check')+' Recebido em '+c.recebidoEm+'</span>'
        : c.status==='atrasado'
          ? '<span class="chip chip-crit">'+ic('alert')+' Atrasado</span>'
          : '<span class="chip chip-warn">'+ic('clock')+' Previsto</span>';
      var actions = c.status!=='recebido' ? '<button class="btn btn-primary" data-comissao-receber="'+c.id+'">'+ic('check')+' Marcar recebido</button>' : '';
      return '<div class="row-card" style="cursor:default; margin-bottom:.6rem"><div class="row-top">'+
        '<div><div class="row-title">'+c.operadora+' · '+c.empresaNome+'</div>'+
        '<div class="row-sub mono">'+c.referenciaLabel+' · '+fmtMoney(c.valorPrevisto)+(c.vendedorNome!=='—'?' · '+c.vendedorNome:'')+'</div></div>'+
        statusChip+'</div>'+(actions?'<div class="btn-row">'+actions+'</div>':'')+'</div>';
    }).join('') : '<div class="empty-col">Nenhum lançamento ainda.</div>';

    return '<div class="content-pad">'+
      '<div style="display:flex; justify-content:space-between; align-items:center; gap:.6rem; margin-bottom:.7rem">'+
        '<div class="section-label" style="margin-bottom:0">Previsto × recebido por operadora</div>'+
        '<button class="btn btn-primary" style="width:auto" data-painel-fin-mode="nova-comissao">'+ic('plus')+' Nova comissão</button>'+
      '</div>'+
      '<div class="row-card" style="cursor:default; margin-bottom:1rem">'+barChartHtml(itens)+'</div>'+
      '<div class="section-label">Lançamentos recentes</div>'+
      listHtml+
    '</div>';
  }

  function viewPainelReajustes(){
    var sorted = STATE.contratos.slice().sort(function(a,b){
      return diasAteAniversario(a.diaAniversario,a.mesAniversario) - diasAteAniversario(b.diaAniversario,b.mesAniversario);
    });

    var listHtml = sorted.length ? sorted.map(function(c){
      var dias = diasAteAniversario(c.diaAniversario,c.mesAniversario);

      '<div style="display:flex; justify-content:space-between; align-items:center; gap:.6rem; margin-bottom:.5rem">'+
        '<div class="section-label" style="margin-bottom:0">Calendário de reajuste</div>'+

      '<p class="row-sub" style="margin-top:.5rem">Esse relatório está sendo desenhado com calma, comparando a Panacea com o mercado, antes de entrar aqui pra valer.</p></div></div>';

  /* ============== VIEW: Gestão ============== */
  function viewVisaoGeralGestao(){
    var ativos = STATE.leads.filter(function(l){return ['fechado','perdido'].indexOf(l.etapa)===-1;});
    var pipeline = ativos.reduce(function(s,l){return s+l.valor;},0);
    var atrasadas = STATE.tasks.filter(function(t){return t.atrasada;}).length + STATE.inclusaoPropostas.filter(function(t){return t.atrasada;}).length;
    var inadimplentes = STATE.financeiro.filter(function(t){return t.etapa==='inadimplente';}).length;
    var pvAbertas = STATE.posvendas.filter(function(p){return p.etapaInterna!=='concluido';}).length;
    var expirando = STATE.posvendas.reduce(function(s,p){return s + (p.anexos||[]).filter(function(a){return a.expira<=3;}).length;},0);
    var pendencias = STATE.posvendas.filter(function(p){return p.pendenciaDoc;}).length;
    return '<div class="content-pad">'+
      '<div class="section-label">Panacea em um relance</div>'+
      '<div class="stat-grid">'+
        '<div class="stat-tile"><div class="n">'+ativos.length+'</div><div class="l">Leads ativos · '+fmtMoney(pipeline)+' em pipeline</div></div>'+
        '<div class="stat-tile"><div class="n" style="color:'+(atrasadas?'var(--critical)':'inherit')+'">'+atrasadas+'</div><div class="l">Itens atrasados no administrativo</div></div>'+
        '<div class="stat-tile"><div class="n">'+pvAbertas+'</div><div class="l">Solicitações abertas no pós-vendas</div></div>'+
        '<div class="stat-tile"><div class="n" style="color:'+((pendencias+inadimplentes)?'var(--critical)':'inherit')+'">'+(pendencias+inadimplentes)+'</div><div class="l">Pendências de doc. + inadimplência</div></div>'+
      '</div>'+
      (expirando ? '<div class="pending-banner">'+ic('doc')+'<span>'+expirando+' documento(s) expirando em até 3 dias.</span></div>' : '')+
      '<div class="section-label" style="margin-top:1.1rem">Ir direto a um departamento</div>'+
      deptButton('leads','Vendas','chart', ativos.length+' leads ativos')+
      deptButton('inclusao','Administrativo','list', atrasadas+' itens atrasados')+
      deptButton('posvendas','Pós-vendas','folder', pvAbertas+' solicitações abertas')+
    '</div>';
  }

  function deptButton(dept,label,icon,sub){
    return '<button class="dept-btn" onclick="window.__panaceaGoDept(\''+dept+'\')"><div class="ic">'+ic(icon)+'</div>'+
      '<div><div class="tt">'+label+'</div><div class="ss">'+sub+'</div></div><div class="arrow">'+ic('chev')+'</div></button>';
  }

  function viewDepartamentosGestao(){
    var deptTabs = [{k:'leads',l:'Vendas'},{k:'inclusao',l:'Inclusão'},{k:'financeiro',l:'Financeiro'},{k:'tarefas',l:'Tarefas adm.'},{k:'posvendas',l:'Pós-vendas'}];
    var chips = deptTabs.map(function(d){ return '<button class="chip '+(currentDept===d.k?'chip-gold':'chip-neutral')+'" style="border:none;cursor:pointer" data-dept="'+d.k+'">'+d.l+'</button>'; }).join(' ');

  function viewAlertasGestao(){
    var alerts = computeAlerts();
    return '<div class="content-pad"><div class="section-label">O que pede atenção agora</div><div class="row-card" style="cursor:default">'+

  /* ============== FICHAS DE DETALHE ============== */
  function openDetail(type, id){
    if(type==='lead') return openLeadDetail(id);
    if(type==='task') return openTaskDetail(id);
    if(type==='incl') return openInclDetail(id);
    if(type==='fin') return openFinDetail(id);
    if(type==='pv') return openPvDetail(id, true);
    if(type==='pv-ext') return openPvDetail(id, false);
    if(type==='contrato') return openContratoDetail(id);
  }

  function timelineHtml(hist){
    return '<div class="timeline">'+hist.slice().reverse().map(function(h){
      return '<div class="tl-item"><div class="tl-dot"></div><div class="tl-tx"><div class="d">'+h.d+(h.interno?' · <span class="chip chip-neutral" style="padding:.05rem .35rem">nota interna</span>':'')+'</div>'+h.t+'</div></div>';
    }).join('')+'</div>';
  }

  function openLeadDetail(id){
    var l = STATE.leads.find(function(x){return x.id===id;});
    if(!l) return;
    var nextStage = {novo:'contato', contato:'proposta', proposta:'negociacao', negociacao:'fechado'}[l.etapa];
    var stageLabel = function(k){ return LEAD_STAGES.find(function(s){return s.key===k;}).label; };
    var html = '<h3>'+l.nome+'</h3><p class="row-sub" style="margin-bottom:.7rem">'+l.empresa+' · '+l.tipo+'</p>'+
      '<div class="kv"><span class="k">Etapa atual</span><span class="v">'+stageLabel(l.etapa)+'</span></div>'+
      '<div class="kv"><span class="k">Valor estimado</span><span class="v mono">'+fmtMoney(l.valor)+'</span></div>'+
      '<div class="kv"><span class="k">Responsável</span><span class="v">'+l.vendedor+'</span></div>'+
      '<div class="section-label" style="margin-top:1rem">Histórico</div>'+timelineHtml(l.historico);
    if(perfil.papel==='vendedor' && nextStage){
      html += '<div class="btn-row"><button class="btn btn-primary" data-action="lead-advance" data-id="'+id+'" data-to="'+nextStage+'">'+ic('chev')+' Mover para "'+stageLabel(nextStage)+'"</button>'+
        '<button class="btn btn-danger" data-action="lead-lost" data-id="'+id+'">'+ic('x')+' Marcar como perdido</button></div>';
    } else if(perfil.papel==='vendedor'){
      html += '<div class="btn-row"><button class="btn btn-ghost" disabled>Negociação encerrada</button></div>';
    }
    openSheet(html);
    bindSheetActions();
  }

  function openTaskDetail(id){
    var t = STATE.tasks.find(function(x){return x.id===id;});
    if(!t) return;
    var stageLabel = function(k){ return TASK_STAGES.find(function(s){return s.key===k;}).label; };
    var nextStage = {afazer:'andamento', andamento:'aguardando', aguardando:'concluido'}[t.etapa];
    var html = '<h3>'+t.titulo+'</h3><p class="row-sub" style="margin-bottom:.7rem">'+t.empresa+'</p>'+
      '<div class="kv"><span class="k">Origem</span><span class="v">'+(t.origem==='cliente'?'Solicitação de cliente':'Interna')+'</span></div>'+
      '<div class="kv"><span class="k">Etapa</span><span class="v">'+stageLabel(t.etapa)+'</span></div>'+
      '<div class="kv"><span class="k">Prazo</span><span class="v">'+t.prazo+(t.atrasada?' (atrasada)':'')+'</span></div>'+
      '<div class="kv"><span class="k">Responsável</span><span class="v">'+t.responsavel+'</span></div>';
    if((perfil.papel==='administrativo' || perfil.papel==='implantacao') && nextStage){
      html += '<div class="btn-row"><button class="btn btn-primary" data-action="task-advance" data-id="'+id+'" data-to="'+nextStage+'">'+ic('chev')+' Mover para "'+stageLabel(nextStage)+'"</button></div>';
    }
    openSheet(html);
    bindSheetActions();
  }

    if(!t) return;
    var stageLabel = function(k){ return INCL_STAGES.find(function(s){return s.key===k;}).label; };
    var nextStage = {recebido:'conferencia', conferencia:'enviado', enviado:'vigente'}[t.etapa];
    var html = '<h3>'+t.empresa+'</h3><p class="row-sub" style="margin-bottom:.7rem">'+t.tipo+' · '+t.vidas+' vidas</p>'+
      '<div class="kv"><span class="k">Etapa</span><span class="v">'+stageLabel(t.etapa)+'</span></div>'+
      '<div class="kv"><span class="k">Prazo</span><span class="v">'+t.prazo+(t.atrasada?' (atrasada)':'')+'</span></div>'+
      '<div class="kv"><span class="k">Responsável</span><span class="v">'+t.responsavel+'</span></div>'+
      '<div class="section-label" style="margin-top:1rem">Histórico</div>'+timelineHtml(t.historico);
    if((perfil.papel==='administrativo' || perfil.papel==='implantacao') && nextStage){
      html += '<div class="btn-row"><button class="btn btn-primary" data-action="incl-advance" data-id="'+id+'" data-to="'+nextStage+'">'+ic('chev')+' Mover para "'+stageLabel(nextStage)+'"</button></div>';
    }
    openSheet(html);

  function openFinDetail(id){
    var t = STATE.financeiro.find(function(x){return x.id===id;});
    if(!t) return;
    var stageLabel = function(k){ return FIN_STAGES.find(function(s){return s.key===k;}).label; };
    var nextStage = {faturar:'aguardando', aguardando:'pago'}[t.etapa];
    var html = '<h3>'+t.empresa+'</h3><p class="row-sub" style="margin-bottom:.7rem">'+t.tipo+'</p>'+
      '<div class="kv"><span class="k">Etapa</span><span class="v">'+stageLabel(t.etapa)+'</span></div>'+
      '<div class="kv"><span class="k">Valor</span><span class="v mono">'+fmtMoney(t.valor)+'</span></div>'+
      '<div class="kv"><span class="k">Vencimento</span><span class="v">'+t.vencimento+(t.atrasada?' (atrasado)':'')+'</span></div>'+
      '<div class="kv"><span class="k">Responsável</span><span class="v">'+t.responsavel+'</span></div>'+
      '<div class="section-label" style="margin-top:1rem">Histórico</div>'+timelineHtml(t.historico);
    if(perfil.papel==='administrativo'){
      html += '<div class="btn-row">';
      if(nextStage) html += '<button class="btn btn-primary" data-action="fin-advance" data-id="'+id+'" data-to="'+nextStage+'">'+ic('chev')+' Mover para "'+stageLabel(nextStage)+'"</button>';
      if(t.etapa==='inadimplente') html += '<button class="btn btn-ghost" data-action="fin-advance" data-id="'+id+'" data-to="pago">'+ic('check')+' Marcar como pago</button>';
      html += '</div>';
    }
    openSheet(html);
    bindSheetActions();

  function openPvDetail(id, internal){
    var p = STATE.posvendas.find(function(x){return x.id===id;});
    if(!p) return;
    var stageLabel = function(k){ return PV_STAGES.find(function(s){return s.key===k;}).label; };
    var nextStage = {recebido:'analise', analise:'processando', processando:'concluido'}[p.etapaInterna];
    var html = '<h3>'+p.tipo+'</h3><p class="row-sub" style="margin-bottom:.7rem">'+p.empresaOuCliente+' · '+shortCode(p.id)+'</p>';
    if(internal){
      html += '<div class="kv"><span class="k">Etapa interna</span><span class="v">'+stageLabel(p.etapaInterna)+'</span></div>';
    } else {
      var st = pvClienteStatus(p);
      html += '<div class="kv"><span class="k">Status</span><span class="v">'+st.label+'</span></div>';
    }
    html += '<div class="kv"><span class="k">Solicitante</span><span class="v">'+p.solicitante+'</span></div>'+
      '<div class="kv"><span class="k">Aberto em</span><span class="v">'+p.dataAbertura+'</span></div>';
    if(internal){
      html += '<div class="kv"><span class="k">Atendido por</span><span class="v">'+(p.responsavel||'Sem responsável')+'</span></div>'+
        '<div class="kv"><span class="k">Prazo</span><span class="v">'+(p.prazo||'—')+(p.atrasada?' <span class="chip chip-crit" style="padding:.05rem .35rem">atrasada</span>':'')+'</span></div>';
    }
    if(p.pendenciaDoc){
      html += '<div class="pending-banner">'+ic('alert')+'<span>'+p.pendenciaDescricao+'</span></div>';
      if(!internal) html += '<div class="btn-row"><label class="btn btn-gold" for="resolvePendInput" style="cursor:pointer">'+ic('upload')+' Enviar documento</label><input type="file" id="resolvePendInput" hidden /></div>';
    }
    if(p.anexos && p.anexos.length){
      html += '<div class="section-label" style="margin-top:1rem">Anexos</div>' + p.anexos.map(function(a){
        return '<div class="kv"><span class="k">'+ic('paperclip')+' '+a.nome+'</span><span class="v" style="display:flex;gap:.4rem;align-items:center">'+expiraChip(a.expira)+
          '<button type="button" class="chip chip-neutral" style="border:none;cursor:pointer" data-download="'+a.path+'">Baixar</button></span></div>';
      }).join('');
    }
    html += '<div class="section-label" style="margin-top:1rem">Histórico</div>'+timelineHtml(p.historico);
    var podeGerenciar = internal && (perfil.papel==='posvendas' || perfil.papel==='implantacao' || perfil.papel==='gestao');
    if(podeGerenciar){
      var pvTeam = STATE.equipeInterna.filter(function(m){ return m.papel==='posvendas' || m.papel==='implantacao'; });
      var respOpts = pvTeam.map(function(m){ return '<option value="'+m.id+'"'+(m.id===p._responsavelId?' selected':'')+'>'+m.nome+'</option>'; }).join('');
      html += '<div class="section-label" style="margin-top:1rem">Responsável</div>'+
        '<form id="pvAtribuirForm" class="btn-row" style="flex-direction:row">'+
          '<select name="responsavel" style="flex:1"><option value="">Sem responsável</option>'+respOpts+'</select>'+
          '<button type="submit" class="btn btn-ghost" style="width:auto">Atribuir</button>'+
        '</form>'+
        '<div class="section-label" style="margin-top:1rem">Prazo</div>'+
        '<form id="pvPrazoForm" class="btn-row" style="flex-direction:row">'+
          '<input type="date" name="prazo" value="'+p.prazoISO+'" style="flex:1" />'+
          '<button type="submit" class="btn btn-ghost" style="width:auto">Salvar prazo</button>'+
        '</form>'+
        '<div class="section-label" style="margin-top:1rem">Adicionar nota interna</div>'+
        '<form id="pvNotaForm">'+
          '<div class="field"><textarea name="nota" rows="2" placeholder="Ex: aguardando retorno da operadora" required></textarea></div>'+
          '<button type="submit" class="btn btn-ghost" style="width:auto">Adicionar nota</button>'+
        '</form>';
      html += '<div class="btn-row" style="margin-top:1rem">';
      if(!p._responsavelId) html += '<button class="btn btn-gold" data-action="pv-claim" data-id="'+id+'">'+ic('user')+' Assumir este atendimento</button>';
      if(nextStage) html += '<button class="btn btn-primary" data-action="pv-advance" data-id="'+id+'" data-to="'+nextStage+'">'+ic('chev')+' Mover para "'+stageLabel(nextStage)+'"</button>';
      html += p.pendenciaDoc
        ? '<button class="btn btn-ghost" data-action="pv-clear-pend" data-id="'+id+'">'+ic('check')+' Marcar pendência como resolvida</button>'
        : '<button class="btn btn-ghost" data-action="pv-set-pend" data-id="'+id+'">'+ic('alert')+' Marcar pendência de documento</button>';
      html += '</div>';
    }
    openSheet(html);
    bindSheetActions();

    var atribuirForm = document.getElementById('pvAtribuirForm');
    if(atribuirForm){
      atribuirForm.addEventListener('submit', function(e){
        e.preventDefault();
        var btn = atribuirForm.querySelector('button[type=submit]');
        btn.disabled = true;
        var novoResp = atribuirForm.responsavel.value || null;
        var novoNome = novoResp ? (STATE.equipeInterna.find(function(m){return m.id===novoResp;})||{}).nome : null;
        var texto = novoResp
          ? (p._responsavelId ? 'Reatribuído para '+novoNome+' (antes: '+(p.responsavel||'sem responsável')+').' : novoNome+' foi atribuído a este atendimento.')
          : 'Responsável removido — atendimento voltou para "sem responsável".';
        sb.from('solicitacoes').update({ responsavel_id: novoResp, updated_at: new Date().toISOString() }).eq('id', id)
          .then(function(){ return addHistorico('solicitacao', id, texto); })
          .then(function(){ showToast('Responsável atualizado'); closeSheet(); return refreshData(); })
          .then(function(){ renderAppBar(); renderBottomTabbar(); renderContent(); })
          .catch(function(){ btn.disabled=false; showToast('Não deu — tente de novo'); });
      });
    }
    var prazoForm = document.getElementById('pvPrazoForm');
    if(prazoForm){
      prazoForm.addEventListener('submit', function(e){
        e.preventDefault();
        var btn = prazoForm.querySelector('button[type=submit]');
        btn.disabled = true;
        var novoPrazo = prazoForm.prazo.value || null;
        sb.from('solicitacoes').update({ prazo: novoPrazo, updated_at: new Date().toISOString() }).eq('id', id)
          .then(function(){ return addHistorico('solicitacao', id, novoPrazo ? 'Prazo ajustado para '+fmtDateBR(novoPrazo)+'.' : 'Prazo removido.'); })
          .then(function(){ showToast('Prazo atualizado'); closeSheet(); return refreshData(); })
          .then(function(){ renderAppBar(); renderBottomTabbar(); renderContent(); })
          .catch(function(){ btn.disabled=false; showToast('Não deu — tente de novo'); });
      });
    }
    var notaForm = document.getElementById('pvNotaForm');
    if(notaForm){
      notaForm.addEventListener('submit', function(e){
        e.preventDefault();
        var texto = notaForm.nota.value.trim();
        if(!texto) return;
        var btn = notaForm.querySelector('button[type=submit]');
        btn.disabled = true;
        addHistorico('solicitacao', id, texto, false)
          .then(function(){ showToast('Nota adicionada'); closeSheet(); return refreshData(); })
          .then(function(){ renderAppBar(); renderBottomTabbar(); renderContent(); })
          .catch(function(){ btn.disabled=false; showToast('Não deu — tente de novo'); });
      });
    }

    var resolveInput = document.getElementById('resolvePendInput');
    if(resolveInput){
      resolveInput.addEventListener('change', function(){
        var file = resolveInput.files && resolveInput.files[0];
        if(!file) return;
        var path = 'solicitacao_'+id+'/'+Date.now()+'_'+file.name;
        sb.storage.from('documentos').upload(path, file).then(function(upRes){
          if(upRes.error){ showToast('Não deu pra enviar o documento'); return; }
          Promise.all([
            sb.from('anexos').insert({ solicitacao_id:id, nome_arquivo:file.name, storage_path:path, tamanho_bytes:file.size, enviado_por:perfil.id }),
            sb.from('historico').insert({ entidade_tipo:'solicitacao', entidade_id:id, texto:'Documento reenviado pelo app.', created_by:perfil.id })
          ]).then(function(){
            showToast('Documento enviado — aguardando conferência do pós-vendas');
            closeSheet();
            refreshData().then(renderContent);
          });
        });
      });
    }
  }

  function addHistorico(tipo, id, texto, visivelExterno){
    var payload = { entidade_tipo: tipo, entidade_id: id, texto: texto, created_by: perfil.id };
    if(visivelExterno===false) payload.visivel_externo = false;
    return sb.from('historico').insert(payload);
  }

  function bindSheetActions(){
    document.querySelectorAll('[data-action]').forEach(function(btn){
      btn.addEventListener('click', function(){
        btn.disabled = true;
        var action = btn.dataset.action, id = btn.dataset.id, to = btn.dataset.to;
        var work;
        if(action==='lead-advance'){
          work = sb.from('leads').update({etapa:to, updated_at:new Date().toISOString()}).eq('id', id)
            .then(function(){ return addHistorico('lead', id, 'Movido para "'+LEAD_STAGES.find(function(s){return s.key===to;}).label+'".'); })
            .then(function(){ showToast('Lead atualizado'); });
        } else if(action==='lead-lost'){
          work = sb.from('leads').update({etapa:'perdido', updated_at:new Date().toISOString()}).eq('id', id)
            .then(function(){ return addHistorico('lead', id, 'Marcado como perdido.'); })
            .then(function(){ showToast('Lead marcado como perdido'); });
        } else if(action==='task-advance'){
          work = sb.from('tarefas_admin').update({etapa:to}).eq('id', id).then(function(){ showToast('Tarefa atualizada'); });
        } else if(action==='incl-advance'){
          work = sb.from('inclusao_propostas').update({etapa:to}).eq('id', id)
            .then(function(){ return addHistorico('inclusao', id, 'Movido para "'+INCL_STAGES.find(function(s){return s.key===to;}).label+'".'); })
            .then(function(){ showToast('Proposta atualizada'); });
        } else if(action==='fin-advance'){
          work = sb.from('financeiro').update({etapa:to}).eq('id', id)
            .then(function(){ return addHistorico('financeiro', id, 'Movido para "'+FIN_STAGES.find(function(s){return s.key===to;}).label+'".'); })
            .then(function(){ showToast('Financeiro atualizado'); });
        } else if(action==='pv-advance'){
          work = sb.from('solicitacoes').update({etapa_interna:to, updated_at:new Date().toISOString()}).eq('id', id)
            .then(function(){ return addHistorico('solicitacao', id, 'Movido para "'+PV_STAGES.find(function(s){return s.key===to;}).label+'".'); })
            .then(function(){ showToast('Solicitação atualizada'); });
        } else if(action==='pv-claim'){
          work = sb.from('solicitacoes').update({responsavel_id: perfil.id}).eq('id', id)
            .then(function(){ return addHistorico('solicitacao', id, perfil.nome+' assumiu este atendimento.'); })
            .then(function(){ showToast('Atendimento assumido'); });
        } else if(action==='pv-set-pend'){
          work = sb.from('solicitacoes').update({pendencia_doc:true, pendencia_descricao:'Documento adicional solicitado pelo pós-vendas.'}).eq('id', id)
            .then(function(){ showToast('Pendência registrada — cliente já vê no app dele'); });
        } else if(action==='pv-clear-pend'){
          work = sb.from('solicitacoes').update({pendencia_doc:false, pendencia_descricao:null}).eq('id', id)
            .then(function(){ return addHistorico('solicitacao', id, 'Pendência de documento resolvida.'); })
            .then(function(){ showToast('Pendência resolvida'); });
        } else {
          work = Promise.resolve();
        }
        work.catch(function(){ showToast('Não deu certo — tente de novo'); }).then(function(){
          closeSheet();
          return refreshData();
        }).then(function(){
          renderAppBar(); renderBottomTabbar(); renderContent();
        });
      });
    });
    document.querySelectorAll('[data-download]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var path = btn.dataset.download;
        sb.storage.from('documentos').createSignedUrl(path, 300).then(function(res){
          if(res.error || !res.data){ showToast('Não consegui gerar o link — tente de novo'); return; }
          window.open(res.data.signedUrl, '_blank');
        });
      });
    });
  }

  /* ============== INÍCIO ============== */
  boot();
})();
</script>
